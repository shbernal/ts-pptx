packages:
  - demos/node
  - demos/showcases
  # Not a demo and not a build step: it holds TypeDoc and the TypeScript 6 that
  # TypeDoc still needs, because TypeScript 7 ships no JS compiler API for it to
  # use. See tools/api-docs/README.md for why this is a workspace member and not
  # a pnpm override — the override was tried and does not bind a peer dependency.
  - tools/api-docs
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  # Lefthook's postinstall is denied, not merely unlisted. All it does is
  # `lefthook install -f`, and that `-f` is the one thing scripts/install-hooks.mjs
  # is written to refuse: with core.hooksPath pointing at a machine-wide hooks
  # directory, forcing writes lefthook's wrappers in there and renames whatever
  # stood in their place to `.old`, disarming every other repo on the machine. The
  # prepare script decides that question properly, per checkout. The binary itself
  # needs no build step, it arrives prebuilt in lefthook-<os>-<arch>, so denying
  # this costs only the hook install we did not want.
  lefthook: false
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - '@types/node@25.9.2'
  # The site's deck preview. `pptx-html` is a sibling project by the same author,
  # and it depends on `@shbernal/ts-pptx` — this package — so a release here makes
  # the docs build unresolvable for 24h unless both are excluded. The release-age
  # delay exists to let a compromised or broken publish be caught by someone else
  # first; that reasoning does not apply to a publish we performed ourselves.
  #
  # Note the default is not visible through `pnpm config get minimumReleaseAge`,
  # which reports `undefined` while pnpm still enforces 1440 minutes.
  - 'pptx-html'
  - '@shbernal/ts-pptx'
  # Same reasoning, same author: `charcheck` is the banned-character gate this
  # repo runs in its own hooks, so waiting a day to adopt a fix we just published
  # would only delay the gate, not vet it.
  - 'charcheck'
  # Same reasoning again: `ooxml-validate` is the schema oracle this repo's test
  # suite is built on, published from a repo of the same author. Its version is
  # also its binary's version, so a fix to either half arrives as a new release —
  # holding those for a day would only delay the gate the suite depends on.
  - 'ooxml-validate'
