#:schema https://developers.openai.com/codex/config-schema.json

# Local stdio, not a hosted endpoint: the schema database ships inside the
# package, so this needs no account and no network once npx has the tarball.
# The startup allowance is larger than the HTTP servers' because the very first
# run downloads it.
[mcp_servers.ooxml]
command = "npx"
args = ["-y", "mcp-server-ooxml"]
startup_timeout_sec = 60
tool_timeout_sec = 60
enabled = true
required = false
default_tools_approval_mode = "approve"

[mcp_servers.microsoft_learn]
url = "https://learn.microsoft.com/api/mcp"
startup_timeout_sec = 10
tool_timeout_sec = 60
enabled = true
required = false
default_tools_approval_mode = "approve"
