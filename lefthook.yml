pre-commit:
  # Sequential (not parallel): eslint --fix and prettier --write now both touch
  # the same staged *.ts files, so running them concurrently could race on writes.
  # eslint first (non-format autofixes), then prettier as the final formatting pass.
  piped: true
  jobs:
    - name: eslint
      glob: '*.{ts,mjs,js}'
      run: pnpm exec eslint --fix --no-warn-ignored {staged_files}
      stage_fixed: true

    - name: prettier
      glob: '*.{json,yaml,yml,mjs,mts,ts,js}'
      exclude:
        - 'pnpm-lock.yaml'
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true

commit-msg:
  # Backstop against a shell-quoting slip mangling a multi-line message (e.g. a
  # PowerShell `@'...'@` here-string run through POSIX sh, which leaks a literal
  # `@` onto the subject). Multi-line messages should be written to a file and
  # committed with `git commit -F <file>`. `{1}` is git's commit-message path.
  jobs:
    - name: check-message
      run: node scripts/check-commit-msg.mjs {1}

pre-push:
  # The whole-repo static gates that CI enforces but pre-commit's per-file
  # autofix cannot catch: a lint/type/format error that is not auto-fixable
  # would otherwise only surface in CI. These are read-only (no writes), so
  # they run in parallel. Tests are intentionally left to CI to keep push fast.
  parallel: true
  jobs:
    - name: lint
      run: pnpm run lint
    - name: format
      run: pnpm run format:check
    - name: typecheck
      run: pnpm run typecheck
    - name: typecheck-scripts
      run: pnpm run typecheck:scripts
