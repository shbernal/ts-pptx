# Installed by the `prepare` script — via scripts/install-hooks.mjs, which skips
# rather than fails where `core.hooksPath` points outside this repo, because a
# `prepare` that exits non-zero takes every `pnpm run` down with it.
#
# Bypass a hook when you genuinely must: `git commit --no-verify` /
# `git push --no-verify`, or `LEFTHOOK=0 git …` to disable all hooks.
#
# pre-commit runs its tools as `node <file>`, never through `pnpm exec`. A hook
# pays that wrapper on every invocation, and it is not small. The cost is pnpm's
# own CLI startup, not dependency work: `pnpm --version`, which resolves nothing,
# already accounts for most of it, and forcing `verify-deps-before-run` on or off
# moves the total by less than the run-to-run noise. So it is a flat per-process
# tax that does not shrink with the two or three files a hook actually hands over.
# Measured on this machine, point-in-time (pnpm 11.3.0, oxlint 1.77.0, 2026-08),
# with `--version`, which does no work at all — oxlint ~0.67 s via `pnpm exec`
# against ~0.11 s direct, oxfmt ~0.72 s against ~0.19 s. That is overhead, not
# lint; end to end over two staged files the pair goes from ~2.0 s to ~0.9 s.
# `node <file>` rather than the `node_modules/.bin` shim because the shim is a
# second process — a `.CMD` that re-execs node — worth another ~0.08 s. Each path
# is the `bin` entry the tool's own package.json declares, the file those shims
# are generated from, so this is the published contract and not a reach into the
# package. scripts/install-hooks.mjs resolves lefthook the same way, for the same
# reason.
#
# pre-push keeps `pnpm run`: those jobs name scripts, not binaries, and inlining
# the script bodies here would be a second definition of each gate to keep in
# sync. Once per push is a fair price for one definition.
pre-commit:
  # Sequential (not parallel): oxlint --fix and oxfmt --write both touch the same
  # staged *.ts files, so running them concurrently could race on writes.
  # oxlint first (non-format autofixes), then oxfmt as the final formatting pass.
  piped: true
  jobs:
    - name: oxlint
      glob: '*.{ts,mjs,js}'
      # `--fix` only. oxlint also offers `--fix-suggestions` and `--fix-dangerously`,
      # both of which its own help says may change program behavior — not something a
      # hook should do to code on its way into a commit.
      run: node node_modules/oxlint/bin/oxlint --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

    - name: oxfmt
      glob: '*.{json,jsonc,yaml,yml,mjs,mts,ts,js}'
      exclude:
        - 'pnpm-lock.yaml'
      # `--no-error-on-unmatched-pattern` is load-bearing, not tidiness: oxfmt exits 2
      # when every path it was handed is excluded by `.oxfmtrc.jsonc`'s ignore rules,
      # and that is reachable here — `pnpm run docs:new` rewrites `docs/docs.json`,
      # which matches the glob above but sits under the config's ignored `docs/**`.
      # Committing only that file would otherwise fail the hook with nothing to fix.
      run: node node_modules/oxfmt/bin/oxfmt --write --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

commit-msg:
  # Backstop against a shell-quoting slip mangling a multi-line message (e.g. a
  # PowerShell `@'...'@` here-string run through POSIX sh, which leaks a literal
  # `@` onto the subject). Multi-line messages should be written to a file and
  # committed with `git commit -F <file>`. `{1}` is git's commit-message path.
  jobs:
    - name: check-message
      run: node scripts/check-commit-msg.mjs {1}

pre-push:
  # The whole-repo static gates that CI enforces but pre-commit's per-file
  # autofix cannot catch: a lint/type/format error that is not auto-fixable
  # would otherwise only surface in CI. These are read-only (no writes), so
  # they run in parallel. Tests are intentionally left to CI to keep push fast.
  parallel: true
  jobs:
    - name: lint
      run: pnpm run lint
    - name: format
      run: pnpm run format:check
    - name: typecheck
      run: pnpm run typecheck
    - name: typecheck-scripts
      run: pnpm run typecheck:scripts
