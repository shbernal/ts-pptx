name: Publish to npm

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The full CI gate, run as-is rather than transcribed. Publishing waits on it.
  gate:
    name: CI gate
    if: github.repository == 'shbernal/ts-pptx'
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish package
    if: github.repository == 'shbernal/ts-pptx'
    needs: gate
    runs-on: ubuntu-latest
    environment: npm-publish

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Ensure npm supports trusted publishing
        # Pin to the npm 11.x line rather than @latest: npm 12.0.0 ships a broken
        # provenance bundle (`Cannot find module 'sigstore'`), which fails
        # `npm publish --provenance`. 11.x (>= 11.5.1) supports trusted publishing
        # and has working provenance. Revisit once npm 12's provenance is fixed.
        run: |
          npm install -g npm@^11
          npm --version

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
          pnpm --version

      - name: Verify tag matches package version
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_REF="v$PACKAGE_VERSION"

          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::Publishing must run from a tag. Select tag '$EXPECTED_REF' for manual runs."
            exit 1
          fi

          if [ "$GITHUB_REF_NAME" != "$EXPECTED_REF" ]; then
            echo "::error::Release tag '$GITHUB_REF_NAME' does not match package version '$PACKAGE_VERSION'. Expected '$EXPECTED_REF'."
            exit 1
          fi

      - name: Verify version is unpublished
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "::error::$PACKAGE_NAME@$PACKAGE_VERSION is already published on npm."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Explicit, because the publish below passes --ignore-scripts and so never
      # fires `prepack`. This is the one build in the workflow, not one of many.
      - name: Build package artifacts
        run: pnpm run build

      - name: Publish to npm
        run: npm publish --access public --provenance --ignore-scripts
