name: Publish to npm

on:
  workflow_dispatch:
  # Pushing a `vX.Y.Z` tag is the release. The GitHub Release is created by the `release`
  # job below once both names are on npm, so it never announces a version npm lacks.
  push:
    tags: ['v*']
  # The `next` channel: every push to `main` that passes CI, published as a prerelease
  # under the `next` dist-tag. See the `next` job below.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

# A release never cancels: two runs on one tag are a re-dispatch racing the original,
# and the second waits for the first. The `next` channel does cancel, because only the
# newest commit on `main` is worth publishing and a queued older one would be skipped by
# its own head-commit check anyway.
concurrency:
  group: ${{ github.event_name == 'workflow_run' && 'publish-npm-next' || format('publish-npm-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'workflow_run' }}

jobs:
  # The full CI gate, run as-is rather than transcribed. Publishing waits on it.
  # Not for the `next` channel, which runs only after that same gate passed as the CI
  # run that triggered it. `publish` needs this job, so it is skipped along with it.
  gate:
    name: CI gate
    if: github.repository == 'shbernal/pptx-ts' && github.event_name != 'workflow_run'
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish package
    if: github.repository == 'shbernal/pptx-ts'
    needs: gate
    runs-on: ubuntu-26.04
    environment: npm-publish

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # No dependency cache in the release job: what ships is installed from the
      # lockfile alone, never restored from a cache another run wrote.
      - name: Setup
        uses: ./.github/actions/setup
        with:
          cache: 'false'
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Verify tag matches package version
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_REF="v$PACKAGE_VERSION"

          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::Publishing must run from a tag. Select tag '$EXPECTED_REF' for manual runs."
            exit 1
          fi

          if [ "$GITHUB_REF_NAME" != "$EXPECTED_REF" ]; then
            echo "::error::Release tag '$GITHUB_REF_NAME' does not match package version '$PACKAGE_VERSION'. Expected '$EXPECTED_REF'."
            exit 1
          fi

      # A release now publishes two names, so "is this version unpublished?" has two
      # answers and the job needs both. The alias name is read back from the staging
      # script rather than written here a second time: a guard that checks a different
      # package than the publish step touches is worse than no guard.
      #
      # The failure is *both* already published, not either. Publishing two packages is
      # not atomic, so the second one can fail on its own — and a run that hard-failed
      # whenever any name was present would make `workflow_dispatch` useless in exactly
      # the state it exists for, since the first name is on the registry by then. Each
      # publish below is skipped when its own name is already there, which makes a
      # re-dispatch on the same tag finish the half that is missing and touch nothing
      # else. If neither is missing there is nothing to do, and that is the error.
      - name: Verify version is unpublished
        id: targets
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          CANONICAL_NAME="$(node -p "require('./package.json').name")"
          ALIAS_NAME="$(node scripts/alias-package.mjs --print-name)"

          CANONICAL_TODO=true
          ALIAS_TODO=true
          if npm view "$CANONICAL_NAME@$PACKAGE_VERSION" version >/dev/null 2>&1; then CANONICAL_TODO=false; fi
          if npm view "$ALIAS_NAME@$PACKAGE_VERSION" version >/dev/null 2>&1; then ALIAS_TODO=false; fi

          if [ "$CANONICAL_TODO" = false ] && [ "$ALIAS_TODO" = false ]; then
            echo "::error::$CANONICAL_NAME@$PACKAGE_VERSION and $ALIAS_NAME@$PACKAGE_VERSION are both already published on npm."
            exit 1
          fi

          echo "canonical=$CANONICAL_TODO" >> "$GITHUB_OUTPUT"
          echo "alias=$ALIAS_TODO" >> "$GITHUB_OUTPUT"
          echo "Publishing: $CANONICAL_NAME=$CANONICAL_TODO $ALIAS_NAME=$ALIAS_TODO"

      # Explicit, because the publish below passes --ignore-scripts and so never
      # fires `prepack`. This is the one build in the workflow, not one of many.
      - name: Build package artifacts
        run: pnpm run build

      - name: Publish to npm
        if: steps.targets.outputs.canonical == 'true'
        run: npm publish --access public --provenance --ignore-scripts

      # The scoped alias, `@shbernal/ts-pptx`: the same build staged under a second name,
      # because npm has one package per name and no redirect. It is the name this project
      # published under first, and it keeps being published so installs that already name
      # it keep resolving. It has its own trusted-publisher configuration naming this
      # workflow, so the OIDC exchange — which npm performs per package — succeeds for
      # both names in one job.
      #
      # It runs *after* the canonical publish, and therefore only if that succeeded. The
      # order is the whole safety property: the alias is a convenience, and a failure in
      # it (a staging error, a registry hiccup, a trusted-publisher configuration that was
      # revoked) must cost at most a re-dispatch, never the release that already went out.
      - name: Publish scoped alias
        if: steps.targets.outputs.alias == 'true'
        run: |
          node scripts/alias-package.mjs --out .tmp/alias-package
          npm publish .tmp/alias-package --access public --provenance --ignore-scripts

  # The GitHub Release for the tag, with that version's changelog section as its notes
  # (scripts/changelog.mjs). Its own job so `contents: write` stays out of the job that holds
  # the OIDC token. Skipped when the Release already exists, so a re-dispatch that only had
  # to finish the alias publish leaves it alone.
  release:
    name: GitHub Release
    if: github.repository == 'shbernal/pptx-ts' && github.event_name != 'workflow_run'
    needs: publish
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The script imports only Node built-ins, so no dependency install.
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists."
            exit 0
          fi
          node scripts/changelog.mjs --notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag

  # The `next` channel: a prerelease of every push to `main` that passed CI, for projects
  # that would rather take an unreleased build than wait for the release. It publishes
  # `pptx-ts` only, as `<base>-next.<run>.g<sha>` (scripts/next-version.mjs), under the
  # `next` dist-tag. `latest` stays where the last release put it, and a caret range never
  # matches a prerelease, so nobody receives these builds without asking for `@next`.
  #
  # No gate job: `workflow_run` fires after `ci.yml` finished on `main`, and the conditions
  # below accept only a run of it that succeeded on a push to this repository. Running the
  # gate again here would put every CI leg through twice per push.
  #
  # `github.sha` is the newest commit on `main` when this run started, and the provenance
  # statement npm attaches names it. Publishing anything else would attest a build to the
  # wrong commit, so a CI run for a commit `main` has already moved past publishes nothing.
  # The run for the newer commit publishes that one instead, once its own CI passes.
  #
  # The scoped alias is not published here. It exists so installs that already name it keep
  # resolving, and none of them asked for prereleases.
  next:
    name: Publish next
    if: >-
      github.repository == 'shbernal/pptx-ts' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_sha == github.sha
    runs-on: ubuntu-26.04
    environment: npm-publish

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # As in `publish`: what ships is installed from the lockfile alone.
      - name: Setup
        uses: ./.github/actions/setup
        with:
          cache: 'false'
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      # Written into the working tree only, never committed. `--ignore-scripts` keeps the
      # `version` lifecycle script out of it, and the constant is synced explicitly instead,
      # so `pres.version` in the build reports the version the registry has.
      - name: Set the prerelease version
        id: version
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          VERSION="$(node scripts/next-version.mjs --run "$GITHUB_RUN_NUMBER" --sha "$HEAD_SHA")"
          npm version "$VERSION" --no-git-tag-version --ignore-scripts
          node scripts/sync-version.mjs
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build package artifacts
        run: pnpm run build

      # `--tag next` is the whole safety property of this job. Without it npm would move
      # `latest` to a prerelease, and every plain install would receive an unreleased build.
      - name: Publish to npm
        run: npm publish --access public --provenance --ignore-scripts --tag next

      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: echo "Published \`pptx-ts@$VERSION\` under the \`next\` dist-tag." >> "$GITHUB_STEP_SUMMARY"
