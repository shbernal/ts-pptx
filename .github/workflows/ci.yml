name: CI

on:
  pull_request:
  push:
    branches:
      - master
  # Exposed as a reusable workflow so `publish.yml` can run this exact gate
  # instead of keeping its own hand-copied transcript of it. The two had already
  # drifted — publish had lost `typecheck:test` and diverged on the pack command.
  workflow_call:

permissions:
  contents: read

jobs:
  # Lint, formatting and the three typechecks are node-version-independent: they
  # read the same sources and the same tsconfig on every leg, so running them per
  # matrix entry was pure duplication. One run, newest supported Node.
  static:
    name: Static checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # No `version:` here, or in any other job — the action reads it from the
      # `packageManager` field in package.json. That field is the single source
      # of truth on purpose: Renovate updates it and cannot update a version
      # transcribed into a workflow, so a pin here would silently drift out of
      # step with the pnpm that generated pnpm-lock.yaml and break
      # `--frozen-lockfile` across a lockfile-format change.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Static checks
        run: pnpm run check:static

  # The tests, unlike the static checks, are genuinely node-version-sensitive, so
  # they do run per version. Coverage thresholds produce an identical verdict on
  # both legs, so collect them once on the primary version.
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - 24.x
          - 26.x

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install OOXML validator
        run: ./tools/ooxml-validator/install.sh

      - name: Test (with coverage thresholds)
        if: matrix.node == '24.x'
        run: pnpm run test:coverage

      - name: Test
        if: matrix.node != '24.x'
        run: pnpm run test

  # The browser lane. The `test` job above proves the emission core against
  # `dist/node.js`; nothing proved `dist/browser.js`, whose adapter is the only
  # runtime-divergent surface in the package and which no headless Node suite can
  # reach (`fetch`, `FileReader`, canvas, object URLs, `<a download>`).
  #
  # It drives `demos/vite-demo`, which imports the SAME showcase module
  # `pnpm demos:build quarterly-review` runs — so the strong assertion is available:
  # the browser-built deck must be byte-identical to the Node-built one, part for
  # part. See test/browser/cross-runtime-bytes.spec.mjs.
  #
  # Not a matrix leg of `test`: it needs a browser download and a preview server,
  # neither of which is Node-version-sensitive. One run, newest supported Node.
  # Chromium only — the engine decision is recorded in playwright.config.ts.
  browser:
    name: Browser (Chromium)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The Chromium download is ~120 MB and 1-2 min cold. Keyed on the lockfile
      # because that is what pins the @playwright/test version, and a browser build
      # is only valid for the Playwright that asked for it.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Still run on a cache hit: the browser binary is cached, the system libraries
      # it links against are not, and `--with-deps` is a fast no-op once the download
      # is already there.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Starts with `ensure-dist`, then builds the demo, then runs the specs.
      - name: Browser tests
        run: pnpm run test:browser

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: .tmp/playwright/
          retention-days: 7

  # Windows is not redundant here. Every branch in `run()` in
  # scripts/script-utils.mjs — the `.cmd` shim handling, the DEP0190 avoidance,
  # the local-bin resolution — exists solely for Windows, and these package
  # scripts are its only exercise. Until this leg existed, that code was
  # unreachable from CI and a Windows-only break in it shipped green.
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package boundary checks
        run: pnpm run check:package
