name: CI

on:
  pull_request:
  push:
    branches:
      - master
  # Exposed as a reusable workflow so `publish.yml` can run this exact gate
  # instead of keeping its own hand-copied transcript of it. The two had already
  # drifted — publish had lost `typecheck:test` and diverged on the pack command.
  workflow_call:

permissions:
  contents: read

jobs:
  # Lint, formatting and the three typechecks are node-version-independent: they
  # read the same sources and the same tsconfig on every leg, so running them per
  # matrix entry was pure duplication. One run, newest supported Node.
  #
  # `check:static` carries `docs:check`, which validates the docs *sources*: frontmatter,
  # code fences, nav entries and internal links. It does NOT carry `docs:build` — that
  # was tried and deliberately removed (AGENTS.md records why), so the VitePress build
  # and the `--dist` pass over the generated llms URLs belong to docs.yml, which is also
  # what uploads the Pages artifact. A link that only the built site can see therefore
  # still fails the deploy rather than the change; that is the accepted trade.
  static:
    name: Static checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # No `version:` here, or in any other job — the action reads it from the
      # `packageManager` field in package.json. That field is the single source
      # of truth on purpose: Renovate updates it and cannot update a version
      # transcribed into a workflow, so a pin here would silently drift out of
      # step with the pnpm that generated pnpm-lock.yaml and break
      # `--frozen-lockfile` across a lockfile-format change.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Static checks
        run: pnpm run check:static

  # The tests, unlike the static checks, are genuinely node-version-sensitive, so
  # they do run per version. Coverage thresholds produce an identical verdict on
  # both legs, so collect them once on the primary version.
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - 24.x
          - 26.x

    # The two measurement oracles (autofit calibration, CJK line breaking) measure with
    # the genuine PowerPoint fonts where a machine has them and with the committed metrics
    # sidecar where it does not. No hosted Linux runner has any of the six faces, so this
    # leg always takes the sidecar path, and `required` is what makes that a real run: a
    # face that resolves through neither source fails the suite instead of skipping the
    # case and reporting green. See test/read/font-oracle.js.
    env:
      FONT_ORACLES: required

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `ooxml-validate` fetches its oracle binary on first use rather than from a
      # postinstall hook, so there is nothing to install — only something to keep.
      # Keyed on the lockfile because the package's version IS its binary's version:
      # a bump changes both, and the old cache entry stops being the right one.
      - name: Cache the OOXML oracle
        uses: actions/cache@v4
        with:
          path: ~/.cache/ooxml-validate
          key: ooxml-oracle-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Resolve it once, before anything parallel starts. Two jobs at once: it keeps
      # the vitest workers from racing to fetch the same archive on a cold cache, and
      # it fails HERE, with the download's own error, rather than inside a suite whose
      # schema assertions would otherwise be skipped. That hard failure is the property
      # that stops a green run from proving nothing, and it must survive any change to
      # this step.
      - name: Fetch the OOXML oracle
        env:
          # The download verifies the archive's build provenance as well as its
          # checksum, and `gh attestation verify` needs a token to query GitHub's
          # attestation API. That check fails closed, so without this the step would
          # fail — in the right direction, for the wrong reason.
          GH_TOKEN: ${{ github.token }}
        run: pnpm exec ooxml-validate --version

      - name: Test (with coverage thresholds)
        if: matrix.node == '24.x'
        run: pnpm run test:coverage

      - name: Test
        if: matrix.node != '24.x'
        run: pnpm run test

      # The script round-trip is a gate, not a report: it prints a script for each read
      # fixture, runs it, and fails on any difference no fidelity note predicted. It had
      # been runnable but unrun — nothing in `verify` or CI invoked it, so a converter
      # regression would have sat undetected until someone thought to call it by hand.
      #
      # Both tiers, because they gate different claims: tier B (template-anchored) against
      # the source deck, tier A (standalone) with no template laid down, so a script that
      # still secretly needed one fails here. ~25s for the pair on the primary leg only —
      # the corpus and the converter are runtime-independent, so a second Node version
      # would re-prove the same thing.
      - name: Script round-trip (both tiers)
        if: matrix.node == '24.x'
        run: pnpm run script:roundtrip:all

      # For the `coverage` job below, which merges this with what the browser lane
      # executed. Only the primary leg collects coverage, so only it has one to upload.
      - name: Upload Node coverage
        if: matrix.node == '24.x'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-node
          path: coverage/coverage-final.json
          retention-days: 1

  # The genuine-font leg.
  #
  # `test` above runs the same two oracles from recorded advances, which proves the model
  # against numbers this repo committed. It cannot prove those numbers still describe the
  # fonts they were read from, and derived data that nothing re-derives is exactly the kind
  # of fixture that rots quietly. This leg is where that check has a home: `windows-latest`
  # carries Arial, Calibri, Tahoma and Malgun Gothic as real files, so every push re-reads
  # their advances out of the installed fonts and fails on any drift.
  #
  # `FONT_ORACLES_GENUINE` is the load-bearing part. Without it a runner image that drops a
  # font would fall through to the sidecar and pass, which is the failure this whole
  # arrangement exists to prevent: the leg would still be green and would no longer be
  # verifying anything. Naming the families makes their absence a build failure. Aptos and
  # Aptos SemiBold are deliberately NOT in the list: they ship with Microsoft 365, no runner
  # has them, and their entries are re-derived on a workstation that does.
  #
  # Windows only, and only these three files: the fonts are the whole point of the leg, and
  # the rest of the suite is already covered on Linux.
  font-oracles:
    name: Font oracles (genuine fonts)
    runs-on: windows-latest

    env:
      FONT_ORACLES: required
      FONT_ORACLES_GENUINE: Arial,Calibri,Tahoma,Malgun Gothic

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Starts with the probe (scripts/font-oracle-probe.mjs), which writes the face-by-face
      # resolution table to the job summary and fails the leg if a declared family is absent
      # — before the suites run, so the reason is the missing font rather than whatever the
      # suites make of it.
      - name: Font oracles
        run: pnpm run test:oracles

  # The render oracle.
  #
  # Everything else in CI is a byte assertion. That leaves markup which is byte-correct and
  # which PowerPoint renders correctly *because PowerPoint recomputes it* — SmartArt's
  # `dsp:drawing` cache is the canonical case — plus the constructs the byte-identity corpus
  # never emits at all, whose only evidence is "the right bytes are in the part". LibreOffice
  # answers both, because it has no SmartArt engine and is not us: it paints the cache and
  # nothing else, and it either acts on the markup we emit or it does not. See
  # scripts/libreoffice-render-smoke.mjs.
  #
  # This is the one machine-dependent oracle that CAN run here — the COM smoke beside it
  # needs a real PowerPoint. Measured on this runner before wiring it in: apt installs
  # `libreoffice-impress` plus `poppler-utils` in ~41s uncached, and the check itself then
  # takes ~2s, so the whole leg is under two minutes and needs no cache to earn its place.
  #
  # `libreoffice-impress`, not the `libreoffice` metapackage: Impress plus the PDF export
  # filter is the entire surface used, and the metapackage adds Writer, Calc, Base and Java.
  #
  # `TSPPTX_RENDER_ORACLE: required` is the load-bearing line, for the same reason
  # `FONT_ORACLES: required` is in the test job. Missing tools are a deliberate SKIP on a
  # workstation, so without this a runner image that stopped shipping one of them would give
  # a green leg that checked nothing at all.
  #
  # No Microsoft fonts here — Arial resolves to Liberation Sans — and poppler's pdftotext
  # disagrees with the xpdf build used on a workstation about details like the codepoint a
  # bullet glyph extracts as. Neither disturbs the assertions, which are differential by
  # construction; that property is what makes this leg portable, so keep it.
  render-oracle:
    name: Render oracle (LibreOffice)
    runs-on: ubuntu-latest

    env:
      TSPPTX_RENDER_ORACLE: required

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install LibreOffice and poppler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-impress poppler-utils

      - name: Render oracle
        run: pnpm run test:lo

  # The browser lane. The `test` job above proves the emission core against
  # `dist/node.js`; nothing proved `dist/browser.js`, whose adapter is the only
  # runtime-divergent surface in the package and which no headless Node suite can
  # reach (`fetch`, `FileReader`, canvas, object URLs, `<a download>`).
  #
  # Two fixtures, started by Playwright itself, so this job stays one command:
  #
  #   - the site's demos page, which imports the SAME showcase module
  #     `pnpm demos:build quarterly-review` runs — so the strong assertion is
  #     available: the browser-built deck must be byte-identical to the Node-built
  #     one, part for part. See test/browser/cross-runtime-bytes.spec.mjs.
  #   - a static server (scripts/browser-harness-server.mjs) serving the shipped
  #     `dist/browser.js` unbundled, for the adapter loaders the demo cannot reach
  #     because its deck draws every asset instead of loading one. See
  #     test/browser/adapter-*.spec.mjs.
  #
  # Not a matrix leg of `test`: it needs a browser download and a preview server,
  # neither of which is Node-version-sensitive. One run, newest supported Node.
  # Chromium only — the engine decision is recorded in playwright.config.ts.
  browser:
    name: Browser (Chromium)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The Chromium download is ~120 MB and 1-2 min cold. Keyed on the lockfile
      # because that is what pins the @playwright/test version, and a browser build
      # is only valid for the Playwright that asked for it.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Still run on a cache hit: the browser binary is cached, the system libraries
      # it links against are not, and `--with-deps` is a fast no-op once the download
      # is already there.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Starts with `ensure-dist`, then builds the site (the `demo` project's fixture is
      # a page of it), then runs the specs.
      - name: Browser tests
        run: pnpm run test:browser

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          # Same dot-directory problem as the coverage upload below: without this the
          # traces artifact has been uploading empty.
          include-hidden-files: true
          path: .tmp/playwright/
          retention-days: 7

      # The raw V8 coverage every adapter spec collected, plus the `dist/` it was
      # collected against. Both, not just the first: the merge projects browser coverage
      # onto the Node report's shape by reading these exact bundles and their sourcemaps,
      # and a `dist/` rebuilt in the merge job — even from the same commit — is a build
      # the browser never ran. Shipping the bytes removes the question.
      - name: Upload browser coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-browser
          # `.tmp/` is a dot-directory, and upload-artifact excludes hidden files unless
          # told otherwise — without this the artifact uploads `dist/` and silently drops
          # every coverage record, and the merge job fails on an empty directory.
          include-hidden-files: true
          path: |
            .tmp/browser-coverage/
            dist/
          retention-days: 1

  # The merged coverage gate, and the only place the repo's point-of-slack doctrine is
  # enforced. It needs both lanes' output, so it cannot live in either of them.
  #
  # `vitest.config.ts` still gates the Node suite on its own numbers inside the `test`
  # job — that is a floor, and it fails fast. This is the number that counts
  # `src/runtime/browser.ts` where it actually runs. See scripts/coverage-gate.mjs.
  coverage:
    name: Coverage (merged)
    runs-on: ubuntu-latest
    needs:
      - test
      - browser

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Node coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-node
          path: coverage/

      # Restores `.tmp/browser-coverage/` and `dist/` together, exactly as the browser
      # job had them. No build step here on purpose — see the upload above.
      - name: Download browser coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-browser

      - name: Merge and gate
        run: pnpm run coverage:gate

      - name: Upload merged report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-merged
          path: coverage/merged/
          retention-days: 7

  # Windows is not redundant here. Every branch in `run()` in
  # scripts/script-utils.mjs — the `.cmd` shim handling, the DEP0190 avoidance,
  # the local-bin resolution — exists solely for Windows, and these package
  # scripts are its only exercise. Until this leg existed, that code was
  # unreachable from CI and a Windows-only break in it shipped green.
  #
  # `check:package` also carries the bundle-size budget, which belongs with the
  # other "what actually ships" gates rather than with the tests.
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package boundary checks
        run: pnpm run check:package
