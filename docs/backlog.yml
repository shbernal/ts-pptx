    summary: Requested automatic support for EXIF image orientation.
    current_project_notes: >
      Decided (2026-06-19): userland, not core — non-target. PptxGenJS embeds image
      bytes verbatim and emits valid OOXML; PowerPoint itself does not honour JPEG
      EXIF orientation either, so the generated package matches PowerPoint's own
      behaviour. Auto-rotating would require decoding EXIF metadata and either
      re-encoding pixels or injecting a compensating xfrm rotation — image
      preprocessing that belongs in the caller's pipeline (or a dedicated image
      library), not in an OOXML serializer. The explicit `rotate` option remains
      available for callers that want to compensate. No OOXML validity problem, so
      nothing to implement here.
