  - id: dn-combo-subchart-option-validation
    source: downstream
    type: downstream-need
    first_seen: 2026-07-28
    last_reviewed: 2026-07-28
    status: implemented
    priority: p2
    target_area:
      - chart-ooxml
      - invalid-ooxml
      - powerpoint-repair
    applies_to_current_project: yes
    non_target_reasons: []
    summary: Per-subchart ChartMulti[].options bypass chart option normalization, so an out-of-range barOverlapPct/barGapWidthPct or an invalid barGrouping is emitted raw and PowerPoint flags the file for repair
    current_project_notes: |
      FIXED 2026-07-28 by `normalizeComboSubchartOptions` (define/chart.ts:347),
      called from addChartDefinition once the chart-level pass has run. It validates
      the value the emitter actually reads — `{ ...chartOptions, ...subOptions }` —
      against that subchart's own resolved type, then writes back only the keys a
      correction changed, so the subchart bag stays a sparse override and the
      emit-time merge is untouched. Keys covered (SUBCHART_VALIDATED_KEYS,
      define/chart.ts:310): barDir, barGrouping, barGapWidthPct, barGapDepthPct,
      barOverlapPct, bar3DShape, holeSize, firstSliceAng, lineDataSymbol,
      lineDataSymbolSize, lineDataSymbolLineSize, dataLabelPosition.

      Two helpers were split out of addChartDefinition so both paths share one rule
      set: `normalizeChartBarGrouping` (:155) and `normalizeChartDataLabelPosition`,
      which now take the plot type as an argument instead of reading `options._type`.
      That closed a second, wider face of the same defect found while fixing it: for
      a combo chart `options._type` is a `ChartMulti[]`, so the type-dependent
      chart-level corrections matched no branch and never ran at all — a bogus
      chart-level barGrouping or dataLabelPosition on a combo was equally unguarded.
      Both now resolve per subchart (one bad chart-level barGrouping correctly lands
      as 'clustered' for the bar group and 'standard' for the line group).

      Behaviour change to note: a stacked bar SUBCHART now emits gapWidth 50, the
      same default a chart-level stacked bar gets, where it previously inherited 150.
      Guarded so an explicit chart-level or subchart barGapWidthPct still wins.

      ORIGINAL REPORT ————————————————————————————————————————————————
      Found 2026-07-28 while probing upstream-issue-1223 (stacked + clustered bars),
      which is the API shape that reaches this hole.

      addChartDefinition runs normalizeChartOptions ONCE, on the merged chart-level
      options (define/chart.ts:457). Per-subchart options live in ChartMulti[].options
      and are merged in only at emit time — `{ ...rel.opts, ...type.options }`
      (chart-xml.ts:380) — after every clamp and enum correction has already run. So a
      per-subchart value is written to the part verbatim.

      Reproduced against the OpenXmlValidator; each row is one combo chart whose FIRST
      bar subchart carries the value, second subchart left default:

        subchart barOverlapPct: 250   -> <c:overlap val="250"/>    1 schema error
                                         ("'250' is not a valid 'SByte' value")
        subchart barGapWidthPct: 9999 -> <c:gapWidth val="9999"/>  1 schema error
                                         (MaxInclusive 500 failed)
        subchart barGrouping:'sideways' -> <c:grouping val="sideways"/> 1 schema error
                                         (Enumeration constraint failed)

      The same three values passed at CHART level are clamped and warned, and validate
      clean: gapWidth 9999 -> 500, overlap 250 -> 100, grouping 'sideways' ->
      'clustered', each with a `ts-pptx: … outside the valid range …` warning. So the
      defect is purely the missing normalize pass on the per-subchart object, not the
      clamps themselves — which is also why it is silent: the caller gets no warning,
      just a file PowerPoint offers to repair.

      Second, smaller symptom of the same gap: grouping-dependent DEFAULTS do not apply
      per subchart. define/chart.ts:391 sets barGapWidthPct 50 for a stacked chart, so a
      chart-level stacked bar emits gapWidth 50 while a stacked SUBCHART emits 150
      (inherited from the chart-level default computed for a chart that is not itself
      stacked). Not invalid, but the two paths disagree on the same input.

      Note the emit-time merge must stay — it is what makes per-subchart options work at
      all. The fix is to normalize each ChartMulti[].options against its own resolved
      subchart type during the define pass, then merge the already-clamped result.
      Grouping validation (define/chart.ts:377-392) is bar-direction dependent, so it
      has to run per subchart type, not once for the chart.
    evidence:
      kinds:
        - local-source-inspection
        - generated-pptx
        - minimal-repro
        - validator-result
        - schema-fixture
      local_files:
        - src/gen/define/chart.ts:155
        - src/gen/define/chart.ts:310
        - src/gen/define/chart.ts:347
        - src/gen/define/chart.ts:489
        - src/gen/define/chart.ts:580
        - src/gen/chart/chart-xml.ts:380
        - src/gen/chart/plot-cat-axis.ts:319
        - test/schema-cases.js
      schema_fixture: test/schema-cases.js "combo subchart options are clamped and enum-corrected (dn-combo-subchart-option-validation)" and "combo chart-level type-dependent options are corrected per subchart (dn-combo-subchart-option-validation)"
      validator_result: "pass (was: fail, 3 cases with 1 schema error each — overlap val='250' not a valid SByte; gapWidth MaxInclusive 500 failed; grouping enumeration failed)"
      powerpoint_result: null
      spec_refs:
        - ECMA-376 Part 1 §21.2.2.147 c:overlap / ST_Overlap (-100..100)
        - ECMA-376 Part 1 §21.2.2.75 c:gapWidth / ST_GapAmount (0..500)
        - ECMA-376 Part 1 §21.2.3.17 ST_Grouping
