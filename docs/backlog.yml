    summary: Wide many-column matrix table with per-column fills / maturity-gradient headers and bracket annotations spanning column groups (comparison-table is deliberately text-on-white with no fills)
    current_project_notes: |
      A consumer building an assessment / scorecard / maturity grid needs a wide,
      many-column (~15) COLORED matrix table that the current primitives do not
      cover. The target visual language:
        - a maturity RAMP across a group of requirement columns (e.g. four levels
          L1→L4), each column header carrying its own fill in a graduated palette
          (paler → deeper);
        - column-group BRACKET annotations above the header band — a right-brace /
          bracket spanning several columns, with a caption — that label what a span
          of columns means.
      The comparison-table primitive is deliberately a quiet text-on-white matrix:
      its column type is `{ id, label }` only — no per-column fill, no header
      gradient, no bracket/annotation layer — and it is not meant to scale to ~15
      columns. There is no other primitive for a wide COLORED matrix.

      Proposed upstream shape (public, generic — every consumer building an
      assessment/scorecard/maturity grid wants this): a table/matrix construct (or
      an extension of the comparison-table family) that accepts per-column fill
      specs (solid or a ramp across a column group), styled header cells, and an
      optional "group bracket" annotation layer keyed to a span of columns. It
      should degrade cleanly to today's text-on-white when no fills are given.

      IMPLEMENTED as `TableProps.columns` (a `TableCellProps[]`): entry `columns[i]`
      is merged as direct per-cell formatting onto every cell starting in column `i`
      (fill/color/bold/align/border/margin/…), baked in the `headerRow` sugar step
      (`src/gen-objects.ts` STEP 1.5) so it flows through the normal cell pipeline.
      Precedence: explicit per-cell `options` > `headerRow` (row 0) > `columns[colIdx]`
      > `tableStyle`/defaults. A maturity-gradient header falls out of the
      property-level merge: shared typography on `headerRow`, graduated fills per
      `columns[i].fill`. The column index counts each cell's `colspan` within a row.
      Optional; degrades byte-for-byte to text-on-white when omitted.

      The bracket / column-group annotation is intentionally NOT a new primitive.
      Composing the existing brace preset shapes (`rightBrace` / `bracePair`) with
      `addText`, positioned from the table `x` and `colW`, covers it; documented on
      the `columns` JSDoc and in CHANGELOG. This keeps PptxGenJS low-level and avoids
