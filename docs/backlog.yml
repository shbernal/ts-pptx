  - id: fork-temml-accent-fidelity
    source: fork:src/math.ts
    type: fork-internal-proposal
    first_seen: 2026-07-07
    last_reviewed: 2026-07-07
    status: on-hold
    priority: p3
    target_area:
      - missing-pptx-feature
    applies_to_current_project: yes
    non_target_reasons: []
    summary: latexToOmml accents (\hat, \bar, \vec, ...) degrade to m:limUpp because temml omits accent="true" on <mover>
    current_project_notes: "Temml renders accent commands (\\hat \\bar \\vec \\dot \\tilde \\ddot \\acute \\grave \\check \\breve \\widehat \\overline ...) as <mover> WITHOUT the accent=\"true\" attribute (and under-accents \\underline/\\utilde as <munder> without accentunder=\"true\"). Browsers derive accent positioning from the MathML operator dictionary so it renders fine in a browser, but mathml2omml keys off the attribute: <mover accent=\"true\"> -> <m:acc> (correct accent, script hugs the base) vs a bare <mover> -> <m:limUpp> (over-limit: wrong spacing/semantics). So latexToOmml('\\\\hat{a}') currently emits a limit-over construct in the .pptx rather than a true accent. The output is still valid OMML and opens clean in PowerPoint, so this is a fidelity limit, not a correctness bug - already documented in docs/math-latex.md 'Scope and limits' (the '\\hat renders via <m:limUpp> rather than <m:acc>' note). The full write-up (repro, affected commands, suggested fix) is captured in ../temml-issue.md, distilled from the retired MATH-LATEX-OMML plan. The clean fix is an explicit accent=\"true\"/accentunder=\"true\" from temml, but on closer inspection that temml change is not as straightforward as first thought; there is no upstream fix or PR and it is not clear it will be fixed. Parked on-hold (owner-gated): do NOT re-raise until either a temml fix lands or the maintainer green-lights a local shim (post-process temml's MathML to stamp accent=\"true\" on known accent operators before handing it to mathml2omml). Companion: upstream-issue-1456 (the shipped math feature)."
    evidence:
      kinds: []
      local_files: []
      schema_fixture: null
      validator_result: null
      powerpoint_result: null
      spec_refs: []
    next_action: none
  - id: fork-write-side-branch-coverage
    source: fork:src/media/content-type.ts
    type: fork-internal-proposal
    first_seen: 2026-07-18
    last_reviewed: 2026-07-28
    status: partially-implemented
    priority: p3
    target_area: []
    applies_to_current_project: yes
    non_target_reasons: []
    summary: Raise write-side branch coverage on the emitters still below the gate (media/content-type, measure-fit/text-fit, gen/table/autopage, gen/define/hyperlinks and gen/define/{zoom,preview-image,background,comment,text,chart} DONE, plus the chart.ts/color.ts dead-code deletions and the docs/testing.md write-side section; only the drawingml/pres stragglers remain, and none of them can move a gate alone)
    current_project_notes: |
      Carried over from the retired REPO-IMPROVEMENT-PLAN (its P6) after the read-side
      branch-coverage sweep landed (commits bbf8d3b4..106cc3fc) and the gate was
      ratcheted to 90/76/96/93 (8479a722). The read-side gaps that plan named
      (read/api/chart.ts, theme-context, shapes, oxml/theme, animation, transition)
      are now covered; the remaining below-average branch coverage is on the WRITE
      side. Re-measured 2026-07-20 (global 90.94/78.1/96.61/94.05, gate still green):

        - gen-tables.ts / gen-objects.ts no longer exist. Commits 92643b41, a710480f,
          f1519793 (all after this item was filed) split their logic out to
          `src/gen/table/{autopage,html-dom}.ts` and `src/gen/define/*.ts`, leaving
          re-export barrels; the barrels were then deleted outright. Target the new
          locations.
        - src/gen/table/autopage.ts (ex getSlidesForTableRows engine): 72.6% branch —
          still the lowest table-path surface.
        - src/gen/table/html-dom.ts reported 0% in coverage/coverage-summary.json,
          which was a measurement artifact rather than a real gap: htmlBorderToProps/
          resolveHtmlColWidth ARE tested (test/regression/html/html-table-border-width.test.js,
          html-table-col-width.test.js), just via a src-import
          (`from '../../src/gen/table/html-dom.ts'`) that bypasses dist instrumentation — see
          the docs/testing.md caveat this item already flagged. SUPERSEDED 2026-07-29:
          the file was excluded from coverage entirely back then (it bundled into the
          browser chunks). It is now its own included `dist/html-dom-*.js` chunk and
          genTableToSlides is covered end-to-end against happy-dom
          (test/regression/html/html-to-slides-node.test.js), measuring 85.09/70.88/76.31/90.38.
          The src-import caveat still applies to the pure helpers in it, so its dist
          numbers understate what is actually tested. Its branch % is now a real target.
        - src/gen/define/*.ts (ex gen-objects.ts) is the biggest low-coverage surface by
          volume; worst branch %: comment.ts 61.8%, hyperlinks.ts 69.1%, chart.ts 72.1%,
          background.ts 71.4%, text.ts 73.5%.
        - measure-fit.ts (67.1%) and text-fit.ts (70.7%) remain the lowest of all listed
          files, branch-wise.
      No missing files — the gap is within-file branches, and per docs/testing.md some
      red dist lines are already covered via src-importing tests, so read
      coverage/coverage-summary.json before assuming a real gap. Ongoing ratchet work,
