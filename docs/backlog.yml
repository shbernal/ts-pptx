    applies_to_current_project: partial
    non_target_reasons: []
    summary: "importSlide v1 gaps: embedded fonts (DONE), slide-size rescale (DONE), notes import (DONE)"
    current_project_notes: |
      importSlide copies a slide's slideLayout -> slideMaster -> theme plus used
      media/chart/embedding parts. Gap status:
        - Slide-size rescale: IMPLEMENTED (2026-06-25). importSlide now takes an
          opt-in { rescale: 'fit' | 'stretch' | true } option. Default false keeps
          the equal-size pre-flight (throws on mismatch, now with a hint pointing at
          the option). 'fit' (alias true) scales by min(sx,sy) and centers the slack
          (aspect preserved); 'stretch' scales per-axis to fill (distorts). Only
          geometry is rewritten — top-level shape/group/graphicFrame transforms
          (a:off scale+translate, a:ext scale) plus table grid (a:gridCol@w by sx,
          a:tr@h by sy); groups are not recursed (children remap via untouched
          chOff/chExt). Fonts/line widths are deliberately left as authored. In copy
          mode the imported layout + master shape trees are rescaled too (resolved via
          slide->layout->master rels), idempotently via a #rescaledParts set so a
          registry-shared master is scaled once; preserve/restyle rebind to this
          deck's own master/layout (already destination size) so only the slide is
          touched. Landed in src/read/api/presentation.ts (#rescaleImportedGeometry /
          #rescalePartGeometry + module helpers computeRescale/rescaleSpTree/
          rescaleXfrm/rescaleTableGrid); tests in test/read/import-slide.test.js
          (fit/stretch/true/copy-layout/throws-without-opt-in + schema validity).
        - Embedded fonts: IMPLEMENTED (2026-06-25). importSlide now takes an opt-in
          { embedFonts: true } flag that carries the source deck's presentation-level
          embedded fonts: the binary ppt/fonts/*.fntdata parts (via #copyPart, so the
          per-source registry dedupes faces shared across repeated imports), the
          application/x-fontdata content-type Default, the presentation font rels, and
          a merged p:embeddedFontLst (CT_Presentation index 7) de-duped by typeface +
          face slot. Default off (unchanged behaviour). Landed in
          src/read/api/presentation.ts (#carryEmbeddedFonts) on the shared model in
          src/embedded-fonts.ts; tests in test/read/embedded-fonts.test.js (incl.
          schema validity) + the author-side case in test/schema.test.js. Oracle:
          test/read/fixtures/embedded-fonts.pptx + embedded-fonts.oracle.json. The
          author-side counterpart (pptx.embedFont) shipped in the same effort — see
          CHANGELOG (write-side embedding is its own feature, recorded there, not here).
          Companion (2026-06-25): the author-side embedFont faces now also flow
          through appendSlides — extractSlides surfaces them on ExtractedSlides and
          #carryGeneratedEmbeddedFonts carries them into the destination deck,
          sharing the merge core #mergeEmbeddedFontEntries with #carryEmbeddedFonts;
          tests in test/read/append-embedded-fonts.test.js. So a generator that
          embeds fonts no longer loses them when appended onto a fromTemplate deck.
        - Notes import: IMPLEMENTED (2026-06-25). importSlide now takes an opt-in
          { importNotes: true } flag. Default off keeps the prior behaviour (the
          notesSlide rel is dropped during the slide-part copy). When set,
          #carryNotes copies the source notesSlide into a fresh part, wires a
          slide->notesSlide rel on the imported slide, repoints the notesSlide's
          own slide back-rel at the new slide (the source slide is NOT copied —
          would be circular), and routes its notesMaster rel through
          #ensureNotesMaster. A presentation has at most one notesMaster
          (CT_NotesMasterIdList holds 0..1 p:notesMasterId), so #ensureNotesMaster
          reuses this deck's existing notesMaster when present (source notesMaster
          + theme NOT copied — destination notes styling wins) and only copies +
          registers (p:notesMasterIdLst after p:sldMasterIdLst in CT_Presentation)
          the source's when the deck has none. Other notesSlide rels (media) copy
          via #copyPart; content types fall out of addPart/#copyPart's
          ensureRegistered. Works across all three theme modes since it runs after
          the slide part is created, not inside #copyPart/#importSlideRebind.
          Landed in src/read/api/presentation.ts (#carryNotes / #ensureNotesMaster);
          tests in test/read/import-slide.test.js (default-drops / register-branch /
          reuse-branch / back-rel-repoint / both schema-valid branches). Fixtures
          already existed: notes-slide-image.pptx (source, real notes text),
          empty.pptx (target without notesMaster), mixed.pptx (target with one).
      Known limitations of the rescale (documented, not bugs): font sizes and line
      widths are not scaled, so heavy down-scaling can overflow text boxes; 'stretch'
      cannot faithfully reposition rotated shapes (off/ext alone can't express it).
