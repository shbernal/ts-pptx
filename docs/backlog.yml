    summary: Expose bodyPr autofit fontScale, per-run font props, and paragraph structure on the inspect read model
    current_project_notes: |
      The `inspect` read model already surfaces a text frame's box, wrap mode,
      autofit MODE, body insets, and a flat run list — but a consumer that wants to
      re-derive a frame's rendered text extent (e.g. an overflow linter, a layout
      auditor) still has to drop to raw slide-part XML with a generic XML parser to
      get three things the read model omits:

        1. the `<a:normAutofit>` `fontScale` VALUE (the read model returns only the
           mode string 'normAutofit', not the baked scale, so a consumer cannot tell
           what size PowerPoint will actually draw the text at);
        2. per-run font properties beyond size/color — `fontFace` (`a:latin@typeface`),
           `bold` (`a:rPr@b`), `italic` (`a:rPr@i`), and character spacing
           (`a:rPr@spc`) — all required to measure a run's width;
        3. paragraph STRUCTURE — runs grouped by `<a:p>`. The flat `textRuns` list
           loses paragraph boundaries, so a width measurement that must be per-line
           (each `<a:p>` is an independent line when `wrap="none"`) cannot be done
           from the read model alone.

      Hand-parsing slide XML downstream re-implements read-model territory this
      package owns and drifts from the writer's own inset/scale conventions. Add to
      the read model: enrich `PptxTextRun` with `fontFace`/`bold`/`italic`/
      `charSpacingPt`; add a paragraph-structured view (`PptxParagraph[]`) to
      `PptxSlideElement`; and expose the normAutofit `fontScale` (as a percent, or
      null when unbaked). All additive — no change to existing fields. A downstream
      overflow/layout auditor can then run entirely off `inspectPptx` with no zip or
      XML dependency of its own.

