      emitter had moved from chart-xml.ts to chart-axes.ts since first_seen). A regression
      in test/regression/chart-bar3d-series-axis.test.js now pins every serAxisLabelPos
      value ('none'|'low'|'high'|'nextTo') round-tripping into c:tickLblPos, plus the unset
