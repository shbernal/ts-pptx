    summary: Asked for text height calculation in Node without browser DOM measurement.
    current_project_notes: >
      Implemented (2026-06-21+). A calibrated, DOM-free text-measurement engine now
      ships: pptx.measureText(text, opts) returns a TextMeasurement (heightIn,
      widthIn, line count, heightExact) using a metric-based wrap model with real
      glyph widths from pptx.registerFontMetrics(face, ttf) and an unregistered-font
      heuristic fallback. The same engine drives export-time autofit baking
      (fit:'shrink' -> normAutofit fontScale, fit:'resize' -> spAutoFit height) so
      the layout-time prediction never drifts from baked output, and is exposed as a
      standalone subpath `pptxgenjs/measure` plus pptx.tableLayout / measureLayout
      for cell geometry. Landed in commits 9b2704ef, a25b0708, b9640ebf, bd4e36c8,
      40e0eb14, 58c11e35 (all after the prior 2026-06-20 review, which is why this
      entry still read 'deferred'). Same Node-first root cause as
