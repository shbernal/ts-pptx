      `x = x || !x ? x : false` -- `a || !a` is true for every value of `a`, so each
      is an identity assignment with a dead alternative. Eleven are the show* block
      in normalizeChartPlotAreaOptions, plus v3DRAngAx and dataLabelBkgrdColors.
      Collapsing them would delete 13 permanently-red branches and change no emitted
      byte, but it is a src edit and so wants a byte-identity baseline/check.

      A reasoning trap recorded so it is not repeated: the second arm of
      `!border.width || isNaN(border.width)` LOOKS unreachable, since NaN is falsy
      and the first arm should catch it. A branch counter records that the second
      operand was EVALUATED, not that it was true, so any truthy width reaches it.
      Two arms were wrongly classified as dead on that reasoning before a probe
      showed otherwise; both are covered now by passing a width rather than omitting
      one. Applies to every `!x || isNaN(x)` and `!x || x.length` shape in the repo.

