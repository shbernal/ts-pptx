schema: 1
# Upstream issue/PR tracking has been retired. This project no longer fetches or
# reconciles against gitbrent/PptxGenJS; `source_repo` is kept only as provenance.
#
# The 19 reviewed upstream-derived entries that tracking left behind now live in
# `docs/backlog-archive.yml`. They were moved out because they are a closed record, not a
# queue — all but one were dispositioned `non-target` with `next_action: none` — and at ~70%
# of the file they made the live work hard to see. Nothing here should link to them; if the
# same report resurfaces, read the archive for the judgement already made.
source_repo: gitbrent/PptxGenJS
purpose: >
  The project's backlog ledger. It records work this project intends to do
  and decisions it has made: `downstream-need` items for generic PPTX behavior a
  downstream consumer needs that belongs in this package, and `fork-internal-proposal`
  items for API-evolution / breaking-change candidates the project proposes for itself
  (not driven by a downstream consumer or an upstream issue).
  Downstream needs are recorded generically: describe the missing PPTX behavior and
  its generic reproduction, never a private consumer's name, files, or content. The
  `source` field carries `downstream` for downstream needs, or `fork[:path]` for
  fork-internal proposals (path points at the source file in THIS repo the proposal
  concerns). A github reference (owner/repo#N or a github.com issues/pull URL) is still
  accepted by the schema, but only the archived entries use one. This file is no longer
  synced against GitHub; the upstream reconciliation tooling has been removed.
project_target_docs:
  - docs/project-target.md
  - docs/runtime-and-package-support.md
  - docs/agent-development.md
  - docs/ooxml-agent-context.md
  - docs/testing.md

# MAINTENANCE (agents):
# - Every vocabulary-constrained field (status, priority, target_area,
#   applies_to_current_project, non_target_reasons, evidence.kinds) must use a value
#   already listed under `vocabulary:` below. Reuse the closest existing term; never
#   invent a synonym (e.g. `validator-pass` instead of `validator-result`).
# - If nothing fits, ADD the new value to the relevant `vocabulary:` list in the same
#   edit (note why), then use it — extending the vocabulary on purpose is fine, drifting
#   off it by typo is not.
# - After ANY edit to this file, run `pnpm run backlog:validate` and fix every
#   error before committing. The validator keys on the `vocabulary:` lists in THIS file.
# - `source` must be consistent with `type`: issue/pull-request entries need a github
#   reference; downstream-need entries need `downstream`; fork-internal-proposal
#   entries need `fork` or `fork:<path>`.
#   New downstream needs / proposals are easiest to add with
#   `pnpm run backlog -- add` (see --help).
# - Downstream needs are ANONYMOUS. Never write a private consumer's name, its file
#   paths, deck/client names, or its content into any entry. Describe only the
#   generic PPTX gap and how any consumer would reproduce it.

vocabulary:
  statuses:
    - needs-repro
    - target
    - accepted
    - interesting-with-tweaks
    - non-target
    - watch
    - deferred
    # on-hold: a deliberate, owner-gated parking. Unlike `deferred` (which routine
    # review may re-raise on its own), an on-hold item must NOT be proposed or
    # re-raised until the maintainer explicitly green-lights it.
    - on-hold
    - implemented
    - partially-implemented
    - superseded
  priorities:
    - p0
    - p1
    - p2
    - p3
    - none
  target_areas:
    - powerpoint-repair
    - invalid-ooxml
    - schema-order
    - relationship-or-content-type
    - chart-ooxml
    - table-ooxml
    - image-svg-media
    - speaker-notes-masters-layouts
    - missing-pptx-feature
    - typescript-api
    - browser-modern-esm
    - package-boundary
  applies_to_current_project:
    - yes
    - partial
    - no
    - unknown
  non_target_reasons:
    - commonjs
    - iife-global
    - cdn-script-tag
    - legacy-dist-artifact
    - unsupported-runtime
    - upstream-build-system
    - release-matrix
    - docs-only-for-legacy-workflow
    - existing-pptx-import
    - not-reproducible-in-current-project
    - insufficient-evidence
    - out-of-project-scope
    - escape-hatch-footgun
    # The ask is a COMPOSITION of primitives this library already emits (a chart
    # "recipe", a multi-shape widget), not an OOXML construct. Its home is a
    # consumer-side component layer; the library's obligation is only that the
    # primitives it composes exist and are sound. Distinct from
    # out-of-project-scope, which dismisses the capability itself.
    - composition-belongs-downstream
    # The construct is valid OOXML and the library can emit it, but PowerPoint does not
    # implement it, so the emitted markup can never affect the render. Distinct from
    # out-of-project-scope (which dismisses the capability) and from invalid-ooxml (the
    # markup is correct). Closing on this reason requires render evidence, not schema
    # reasoning -- the object model reports the resolved model, not what is painted.
    - not-supported-by-powerpoint
  evidence_kinds:
    # Source / spec reading
    - local-source-inspection
    - ooxml-reference
    - microsoft-reference
    # Reproduction artifacts
    - minimal-repro
    - generated-pptx
    - extracted-xml
    # Automated tests / validation
    - regression-test
    - schema-fixture
    - validator-result
    # Performance measurement (timing/throughput spike, not a correctness test)
    - benchmark
    # Application-render verification
    - render-check
    - powerpoint-result
    - powerpoint-authored-comparison
  constructs:
    # OOXML construct identity for a downstream replication capability audit. An
    # entry tags the OOXML construct(s) it gates so a consumer can join
    # detected-construct -> gating-entry -> live status directly off this ledger,
    # with no hand-curated construct map. Keys are the stable detector keys; the
    # comment names the DrawingML element each identifies.
    - gradient-fill #         <a:gradFill> shape fill
    - gradient-line-stroke #  <a:gradFill> inside <a:ln>
    - custom-geom #           <a:custGeom> freeform geometry
    - preset-geom-exotic #    non-trivial <a:prstGeom> presets (blockArc/homePlate/textArch*)
    - text-warp #             <a:prstTxWarp> preset text warp
    - connector #             <p:cxnSp> connector autoShape
    - outer-shadow #          <a:outerShdw> drop shadow
    - bullet-char #           <a:buChar> symbol bullet
    - bullet-autonum #        <a:buAutoNum> auto-number bullet
    - group-scale #           scaled group (chOff/chExt vs off/ext)
    - group-rot-flip #        group <a:xfrm> @rot/@flipH/@flipV
    - autofit-shrink #        <a:normAutofit> shrink-to-fit text
    - autofit-resize #        <a:spAutoFit> resize-to-fit text (added 2026-06-21 for the measured-text-fit oracle)
    - vertical-text #         <a:bodyPr vert="…"> text direction
    - style-ref-color #       <p:style> <a:fillRef>/<a:lnRef> theme colour
    - blip-fill-shape #       <a:blipFill> as an object's fill: a <p:sp>, a text box, or an <a:tcPr> table cell (cell coverage added 2026-07-27)
    - slide-transition #      <p:transition> slide transition (added 2026-06-26 for docs/animations-and-transitions.md)
    - build-animation #       <p:timing>/<p:bldLst> per-shape build animation (added 2026-06-26 for docs/animations-and-transitions.md)
    - zoom-object #           <p:graphicFrame> Slide/Section/Summary Zoom in the 2016 zoom namespaces (added 2026-07-21 for dn-zoom-links)
    - model3d-object #        <am3d:model3d> embedded 3D model graphicFrame in the 2017 model3d namespace (added 2026-08-06 for upstream-issue-585)

item_fields:
  id: stable local identifier; upstream-issue-N / upstream-pr-N for upstream, dn-<slug> for downstream-need, fork-<slug> for fork-internal-proposal
  source: github reference (owner/repo#N or github.com issues/pull URL) for upstream; "downstream" for downstream-need; fork[:path] for fork-internal-proposal
  type: issue, pull-request, downstream-need, or fork-internal-proposal
  first_seen: ISO date when recorded locally
  last_reviewed: ISO date when last classified
  status: one vocabulary.statuses value
  priority: one vocabulary.priorities value
  target_area: list of vocabulary.target_areas values
  applies_to_current_project: one vocabulary.applies_to_current_project value
  non_target_reasons: list of vocabulary.non_target_reasons values
  summary: short one-line summary
  constructs: optional; list of vocabulary.constructs OOXML construct keys this entry gates (read by a downstream replication capability audit)
  current_project_notes: local decision note; for downstream-need, the full generic design rationale belongs here (no private consumer names/paths/content)
  evidence: local evidence gathered against this checkout
  next_action: next local action or none

# Add an upstream item by hand following the example below. Add a downstream-need
# the easy way with `pnpm run backlog -- add` (see --help), then write its generic
# design rationale into current_project_notes as a block scalar.
#
# items:
# - id: upstream-issue-1234
#   source: gitbrent/PptxGenJS#1234
#   type: issue
#   first_seen: 2026-06-07
#   last_reviewed: 2026-06-07
#   status: interesting-with-tweaks
#   priority: p1
#   target_area:
#     - powerpoint-repair
#     - invalid-ooxml
#   applies_to_current_project: partial
#   non_target_reasons: []
#   summary: PowerPoint repair report for a generated chart.
#   current_project_notes: >
#     The behavior may apply, but the upstream fix also touches legacy package
#     artifacts. Re-evaluate only the emitted OOXML behavior.
#   evidence:
#     kinds: []
#     local_files: []
#     schema_fixture: null
#     validator_result: null
#     powerpoint_result: null
#     spec_refs: []
#   next_action: create-minimal-repro
items:
  - id: dn-doc-render-caveats
    source: downstream
    type: downstream-need
    first_seen: 2026-06-18
    last_reviewed: 2026-06-25
    status: on-hold
    priority: p3
    target_area: []
    applies_to_current_project: yes
    non_target_reasons: []
    summary: "Document PowerPoint-vs-LibreOffice render caveats the library intentionally does not guarantee"
    current_project_notes: |
      ON HOLD 2026-06-23 (user request): do NOT surface this in "what can we build
      next" suggestions until the user explicitly asks for it. The underlying
      render-caveat behaviours are being actively reworked elsewhere, so the drafted
      doc text below is likely stale; writing it now would clutter the docs with
      information that will change. Keep the item (the need is real) but treat it as
      parked, not actionable, until reactivated. -- end hold note --

      Because ts-pptx does no glyph measurement or line-breaking, several text
      behaviors emit correct OOXML yet render differently across PowerPoint,
      LibreOffice, and the intended layout. These are documented limitations, not
      bugs, and their guard lives downstream (a consumer with the fonts and a
      headless renderer can measure/resize before addText). Write them down in the
      project docs so every consumer knows what schema fixtures intentionally do NOT
      assert:
        - fit:'shrink' emits a bare <a:normAutofit/> ONLY in the no-metrics fallback:
          when a font's metrics are registered, the measured-fit pass now bakes a real
          fontScale (vertical overflow, and horizontal for wrap=false frames — see
          dn-autofit-shrink-horizontal). Without registered metrics the bare flag is
          kept and PowerPoint computes the scale on edit/resize, so such decks overflow
          until a human touches the shape.
        - wrap:false reliably emits wrap="none", but whether text overflows or is
          clipped is renderer-defined (PowerPoint spills, LibreOffice may clip).
        - breakLine faithfully splits paragraphs, but the resulting visual line
          count (and whether it fits) is layout-dependent.
      We may still add serialization-contract fixtures later (assert "option X
      emits attribute Y" only) but framed strictly as XML assertions, never as
      rendering guarantees.
    evidence:
      kinds: []
      local_files:
        - src/gen/drawingml/text-body.ts
        - src/gen/drawingml/text-run.ts
      schema_fixture: null
      validator_result: null
      powerpoint_result: null
      spec_refs: []
    next_action: On hold per user request — do not surface in suggestions; reactivate (and re-derive the caveat list, which is likely stale) only when the user asks.
  - id: dn-registry-components
    source: downstream
    type: downstream-need
    first_seen: 2026-06-18
    last_reviewed: 2026-06-24
    status: on-hold
    priority: none
    target_area:
      - missing-pptx-feature
      - typescript-api
    applies_to_current_project: partial
    non_target_reasons: []
    summary: "Graduate generic registry component primitives into the project once the contract settles"
    current_project_notes: |
      ON HOLD — owner-gated. Do NOT propose, plan, re-raise, or surface this item
      in suggestions until the maintainer explicitly green-lights it, regardless of
      its p2-shaped value. Parked 2026-06-24 after a readiness review found the
      precondition unmet: the contract that matters is not the small per-component
      render-result shape but the whole layout/theme substrate every component
      reaches into (a theme token schema, region/layout, layout-time text measure,
      a design-intent/semantics layer, icons, catalog) — much of it brand/workflow
      coupled and meant to stay in the consumer — and that substrate is still under
      heavy active churn. Graduating now would be a hard cross-repo move that freezes
      a still-moving API. Reactivate only on the owner's word, and re-derive the
      candidate list below (it will likely be stale).

      A downstream consumer composes decks from a typed component registry. The
      generic, brand-free building blocks are project candidates once the component
      contract stabilizes; defer the actual move until then. Brand chrome and the
      consumer's theme stay downstream; the upstream form of asset-bearing components
      takes already-resolved image paths (asset resolution stays downstream). The
      generic region/semantics/naming layout helpers are also candidates.

      Generic candidate primitives:
        - metric-card-grid — grid of metric cards (value + label + icon).
        - stat-callout — single hero number; degenerate single-card sibling of
          metric-card-grid.
        - key-points — bullet list with markers.
        - comparison-table — two-axis comparison table.
        - callout-banner — single emphasized takeaway band (bar or solid).
        - icon-label-row — row/column of icon+label pairs.
        - process-steps — ordered process/timeline with native arrow endcaps
          (connectors lean on line.endArrowType, already upstream).
        - two-column-split — LAYOUT primitive returning a two-column result
          (render result plus left/right regions); surfaces the layout-component
          return-shape extension. Both the primitive AND the return-shape extension
          are upstreamable; a pure regions helper exposes the layout without chrome.
        - logo-group-panel — grouped brand-logo panels (seeded chip scatter);
          shape generic, asset resolution downstream.
        - quadrant-matrix — 2x2 positioning matrix with native line arrowheads
          (rotated y-axis title needs the text-direction workaround).
    evidence:
      kinds:
        - local-source-inspection
      local_files:
        - src/gen/define/shape.ts
      schema_fixture: null
      validator_result: null
      powerpoint_result: null
      spec_refs: []
    next_action: none-until-owner-greenlights
  - id: dn-logo-cloud-helper
    source: downstream
    type: downstream-need
