      - chart-ooxml
      - missing-pptx-feature
    applies_to_current_project: yes
    non_target_reasons: []
    summary: Requested Sunburst chart support using newer chart extension namespaces.
    current_project_notes: >
      SUNBURST SHIPPED 2026-07-21 (with treemap, the hierarchical cx pair). The
      chartEx (cx:) subsystem carries waterfall, funnel, treemap and sunburst
      end-to-end (separate chartEx{N}.xml part in the 2014/chartex ns, chartex+xml
      content type, mc:AlternateContent slide reference with a Fallback shape, and
      the mandatory style/colors sidecar parts PowerPoint requires or it reports
      0x80070570). See src/gen/chart/chartex-xml.ts, chartex-data.ts,
      chartex-style.ts. Treemap + sunburst were confirmed against
      PowerPoint-authored references (AddChart2 type 117 / 120) and read back as
      those types over COM: they use the BASE feature namespace cx1 (like
      waterfall, not funnel's cx2), are axis-free, and carry a MULTI-LEVEL category
      dimension — one <cx:lvl> per hierarchy level (leaf-first) under a single
      spanning <cx:f> — plus a numeric dim tagged type="size" (not "val").
      Treemap adds <cx:layoutPr><cx:parentLabelLayout val="overlapping"/>;
      sunburst has no layoutPr. Histogram also shipped 2026-07-21 (category-less
      cx layout: raw observations in a single numDim, no strDim, layoutId
      "clusteredColumn" + <cx:binning>; reads back as ChartType 118). Pareto
      shipped 2026-07-21 too (the first MULTI-SERIES cx layout: a clusteredColumn
      series with <cx:aggregation/> + a paretoLine series ownerIdx=0 on a secondary
      0..1 percentage axis; reads back as ChartType 122). Pareto surfaced a
      schema-vs-PowerPoint divergence — the OpenXML SDK models <cx:axisId> as a
      leaf-TEXT element so the validator rejects the val attribute, but PowerPoint
      REQUIRES the attribute form <cx:axisId val="N"/> and corrupts (0x80070570) on
      the text form; its schema-case whitelists only cx:axisId/@val errors.
      Box-and-whisker shipped 2026-07-21 as well (layoutId "boxWhisker": flat labeled
      category data like pareto, a <cx:layoutPr> with a <cx:visibility> toggle set
      (meanLine/meanMarker/nonoutliers/outliers) + <cx:statistics quartileMethod>,
      NO axisId binding, and a cat(id0 gapWidth1)+val(id1) axis pair; a new
      `statistics` opt exposes the quartile method and visibility flags). Unlike
      pareto it has NO schema divergence — it validates with zero errors and reads
      back as ChartType 121. Region map (regionMap) shipped 2026-07-21 as well, the
      LAST chartEx type — so the whole cx family is now done. It is a flat labeled
      category chart whose numeric dim is tagged type="colorVal" (the value drives
      each region's fill color), a single regionMap series carrying a <cx:layoutPr>
      with a <cx:geography cultureLanguage cultureRegion attribution/> hint (all
      three attributes schema-required), axis-free, and gated on the LATER cx4
      feature namespace (2016/5/10/chartex). PowerPoint's own geoCache binary Bing
      blob cannot be reproduced offline so it is omitted; PowerPoint re-resolves the
      geography from the region names on open, so this is best-effort/write-only
      (names must match PowerPoint's geography DB or the map renders blank). No
      dedicated colors part was needed (the generic chartEx colorStyle matched
      PowerPoint's own). No schema divergence — validates clean; reads back as
      ChartType 140. A new `geography` opt exposes cultureLanguage/cultureRegion.
      Classic-namespace stock also shipped 2026-07-21 (Track A of the plan, separate
      from this chartEx issue): a `<c:stockChart>` with fixed-order price series drawn
      with invisible lines + `<c:hiLowLines>`; ohlc/vohlc add `<c:upDownBars>`, and the
      volume styles (vhlc/vohlc) lead with a `<c:barChart>` Volume series on the primary
      axis pair with the price series on a secondary pair (4-axis combo, second cat axis
      hidden). New `stockStyle` opt; reads back as ChartType 88/89/90/91; no schema
      divergence. See src/gen/chart/plot-stock.ts. Classic-namespace surface also shipped
      2026-07-21, the LAST modern chart type — so BOTH the classic (stock/surface) and
      chartEx families are now complete. Surface emits `<c:surface3DChart>` (3-D, surface3D
      default) or `<c:surfaceChart>` (2-D contour); like bar3D it plots over a category ×
      series grid so it gets a `<c:serAx>` + a `<c:view3D>` and floor/side/back walls. The
      cosmetic `<c:bandFmts>` band-color list is omitted (PowerPoint regenerates it on open;
      verified over COM). New `surface3D` + `surfaceWireframe` opts; reads back as ChartType
      83/84/85/86; no schema divergence. See src/gen/chart/plot-surface.ts.
