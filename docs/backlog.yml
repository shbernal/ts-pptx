      FIRST THRESHOLD BUMP of this effort: branches 79 -> 80 (measured 81.07, so a
      full point of slack remains). Statements/functions/lines deliberately left at
      91/97/94 -- their margins are 1.9/1.2/1.5, which is not enough to pin a notch
      without risking a flaky gate. Ratchet upward only; nothing loosened.

      The lesson to carry into the remaining work -- ask which PUBLIC DOOR reaches a
      branch before calling it dead. text-fit's newline handling and its
      lineSpacingPct/spaceBefore/spaceAfter defaults are genuinely unreachable from a
      deck: buildFitParagraphs pre-splits every "\n" and always fills those fields.
      They are fully reachable from `ts-pptx/measure`, a published subpath that exists
      precisely so a consumer can hand-build FitParagraph[] -- and that subpath had no
      dist test for the wrap model at all. Covering it there is what took text-fit to
      100%, and it is the reason a "dead" branch should not be fenced on the strength
      of one entry point. Same shape in the table half: normalizeRuns's
      single-run-object form is unreachable from addTable (which normalizes a missing
      cell text to '' at define/table.ts:418) but reachable from tableLayout(), which
      takes caller rows unnormalized.

      What stays red in measure-fit.ts is one class and should stay that way: ~50
      `?? 0` / `|| {}` fallback arms on values the caller already guarantees
      (prefilled arrays, fields the define pass always sets), plus the `!options` /
      `!paragraphs` guards normalization makes unreachable. Unreachable by
      construction per docs/testing.md; reaching them needs hand-built input no caller
      produces.
