  - id: fork-package-parts-public-api
    source: fork:src/package/assemble.ts
    type: fork-internal-proposal
    first_seen: 2026-07-21
    last_reviewed: 2026-07-21
    status: target
    priority: p2
    target_area:
      - package-boundary
      - typescript-api
    applies_to_current_project: yes
    non_target_reasons: []
    summary: expose a public "emit OOXML parts without zipping" API on the seam that the package-assembly extraction already created
    current_project_notes: >
      The package-assembly extraction (commit 67d0ff95) moved the whole write pipeline into
      package/assemble.ts::writePackage(source, props), which builds every part via zip.add(...)
      and then finishes with a single zip.generate(...). That is the seam a public "give me the
      parts, I will zip/route them myself" API builds on: split writePackage into
      buildPackageParts(source, props): Promise<PackagePart[]> plus a thin zipPackageParts(parts,
      props), with writePackage = zip after build (behavior unchanged). The split itself is
      mechanical; the reason it is filed separately from the extraction is that the *public shape*
      is a real contract to design -- once exposed, the package's internal part layout and emission
      order become observable API. Open questions to settle before building:
        1. Return shape: an ordered Array<{ path; data; compression }> (NOT a Map) so emission
           order is preserved -- the byte-identity refactor harness relies on that ordering.
        2. data type: parts are currently a mix of XML strings and binary (store:true fonts,
           base64-decoded media). Normalize to Uint8Array for a clean contract (forces eager XML
           encoding) vs a tagged string|bytes union -- pick one and commit.
        3. Entry point + props: a new ts-pptx method (toParts()?) parallel to write(); decide
           which WriteProps still apply (compression is meaningless without zipping; onMediaError
           still does), and whether the per-entry STORE-vs-DEFLATE hint is part of the public shape.
        4. Stability promise: document that part paths + ordering are now observable API, since
           that is the real cost of exposing this.
      B3 in the refactor deliberately built only the internal seam and did not add this API,
      because the contract deserves its own design pass -- this entry is that pass.
    constructs: []
