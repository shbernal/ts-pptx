  - id: dn-animation-objectname-escaping
    source: downstream
    type: downstream-need
    first_seen: 2026-07-27
    last_reviewed: 2026-07-27
    status: target
    priority: p2
    target_area:
      - typescript-api
    applies_to_current_project: yes
    non_target_reasons: []
    summary: addAnimation objectName lookup compares a raw caller string against the stored XML-escaped objectName, silently dropping animations targeting a shape whose name contains an XML metacharacter
    current_project_notes: |
      `objectName` is escaped ONCE upstream, at define time, and stored in its escaped form on the
      slide object (`encodeXmlAttrValue(validateObjectName(...))` in src/gen/define/*.ts); the
      emitter `cNvPrOpen` writes it out raw. Anything that later looks a shape up BY NAME is
      therefore comparing against escaped text and must escape its own lookup key to match.

      `resolveObjectNameToId` (src/gen/slide/shape-ids.ts) does a plain `===` against the stored
      name. Its two callers disagree: `addConnector` escapes its key first (src/gen/define/
      connector.ts, `resolveCxn`), but `addAnimation` passes `anim.objectName` through raw
      (src/gen/anim/animation.ts). So an animation whose target name contains `&`, `<`, `>`, `"`
      or `'` never resolves, and the effect is dropped with a warning that reads as if the shape
      does not exist.

      Confirmed repro: a rect with `objectName: 'Q&A'` plus `addAnimation({ preset: 'fadeIn',
      objectName: 'Q&A' })` emits no `<p:anim>` and warns `no object named "Q&A" on the slide`;
      the same deck with `objectName: 'QandA'` emits the animation. Pre-existing and independent
      of dn-xml-attr-whitespace (which changed WHICH escaper is used, not this mismatch).

      Two candidate fixes, and the choice is the interesting part:
        - Narrow: escape the key in `addAnimation`, matching what `addConnector` already does.
          One line, no byte change for any deck that works today.
        - Root cause: store `objectName` RAW on the slide object and escape once at emission in
          `cNvPrOpen`, so no lookup ever needs to know about escaping. This removes the whole
          class (any future by-name lookup is correct by default) but touches ten define sites
