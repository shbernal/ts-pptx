      narrow probe left in coverage/ (or a later full run wiping coverage/probe) can
      leave a stale coverage-final.json that reports FEWER covered branches than a
      three-file probe does. The tell is exactly that -- a subset beating the full
      run. Re-measure rather than reason from what is on disk.

