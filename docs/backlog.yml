      #nextMasterLayoutId, #clearLayoutIdList, #linkLayoutIntoMaster, ~218 lines -- is the
      exception: it is the only code that reads #importRegistry and #rescaledParts, and
      #copyPart is a hub called from seven sites (importSlide, #carryNotes,
      #ensureNotesMaster, #carryEmbeddedFonts, importSlideMasters, #importSlideRebind,
      #carryRel). Extracting it means introducing an explicit context object
      ({ opc, presentationPart, registry, rescaledParts }) and threading it through all
      seven -- a design change, not a file move. Deliberately deferred rather than rushed:
      this is the part-copy and relationship-rewriting path, where package-corruption bugs
      live, and unlike the gen/ side it has no byte-identity gate to catch a mistake. Worth
      doing only alongside a deliberate look at whether that context wants to be its own
