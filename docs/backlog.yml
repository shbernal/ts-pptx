      Two findings that change how these numbers should be read:
        - autopage.ts is low on FUNCTIONS and STATEMENTS, not mainly on engine
          branches, and the reason is the `if (tableProps.verbose) console.log(...)`
          debug dumps -- seven uncovered functions and ~50 uncovered statements. No
          test anywhere sets `verbose`, which is a public TableProps option whose dump
          does arithmetic and .toFixed() on props that may legitimately be strings. A
          test there pins "the debug dump survives its inputs", not emitted OOXML, and
          should say so; it is not a substitute for the paging-engine branches.
        - color.ts's two uncovered functions (componentToHex, rgbToHex) cannot be
          covered by any Node test. Their only callers are in gen/table/html-dom.ts,
          the browser-only path that vitest.config.ts excludes via dist/browser*.js,
          and they are not publicly exported. The fix is to move them into html-dom.ts
          where the existing exclusion already covers them -- deleting a false signal
          rather than testing dead code, and no `v8 ignore` fence needed.

