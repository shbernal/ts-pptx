  - id: dn-pptx-to-script
    source: downstream
    type: downstream-need
    first_seen: 2026-07-26
    last_reviewed: 2026-07-27
    status: implemented
    priority: p2
    target_area:
      - typescript-api
      - package-boundary
    applies_to_current_project: yes
    non_target_reasons: []
    summary: Emit TypeScript source from an existing .pptx that regenerates an equivalent deck through the public write API
    current_project_notes: |
      IMPLEMENTED 2026-07-27 as the `@shbernal/ts-pptx/script` subpath (`src/script.ts`,
      `src/script/`). Both tiers ship. `readModelToIr(presentation)` returns the deck IR;
      `printScript(ir)` prints the template-anchored tier and `printStandaloneScript(ir)`
      the standalone one, each returning `{ code, assets, notes }` where `notes` is the
      loss set that applies to THAT output rather than `DeckIr.fidelity`. `canonicalDeckIr`
      + `diffDeckIr` and `pnpm run script:roundtrip [-- --tier a]` are the round-trip
      check. User-facing documentation is `docs/reference/pptx-to-script.md`; the
      subsystem's place in the codebase is in `docs/architecture.md`. Verified across the
      41-fixture corpus: every fixture prints deterministically, executes, and round-trips
      with 0 undeclared differences in both tiers.

      DELIBERATELY NOT BUILT, each a real gap rather than an oversight:
        - Slide transitions are not transcribed in either tier, although
          `slide.transition` is a public setter and the write vocabulary names 21 of them.
          The read model reports an open type string that also covers the `p14`/`p15`
          modern effects, so the mapping needs a known-vocabulary filter plus a note for
          the rest. Cheap, benefits both tiers.
        - The read-side fidelity backlog below (see THE UNMEASURED HALF) is untouched and
          is still the binding constraint on both tiers: `lnRef` width/dash, bullet
          font/size/startAt, `a:fillToRect`, `effectRef`, custGeom `gdLst`/`ahLst`/
          `cxnLst`, `a:tabLst`, `a:prstTxWarp`, plus `p:txStyles` and master/layout
          decoration. Not filed as separate entries: the corpus is construct-weighted, so
          their ordering would be a coverage argument and not a frequency one.
        - A frequency-weighted corpus (`pptx-bank/`) is still empty and still needs the
          maintainer, so every count in the shipped documentation is coverage, not
          frequency. `--dir` is wired on both measurement scripts for the day real decks
          land.
      One defect found on the way was filed rather than fixed, because it changes emitted
      bytes for existing callers: `dn-xml-attr-whitespace`.

      The design rationale below is the record of the decisions, kept because the plan
      file that held it is gone.

      The generic need: a consumer holding a `.pptx` wants runnable TypeScript that
      rebuilds an equivalent deck through this library's public write API — so the deck
      becomes editable, diffable, and parameterizable source instead of an opaque binary.
      The read model can already open and inspect such a deck; nothing turns that
      inspection back into authoring calls.

      Lossy by construction and by agreement. The library does not cover every OOXML
      construct, so the deliverable is "a faithful script plus an honest account of what
      it dropped", never "a perfect copy". The design decisions below are recorded so
      they are not re-derived.

      TWO TIERS, ONE INTERMEDIATE REPRESENTATION, TWO PRINTERS. Slide *bodies* map near
      one-to-one from read model to write-API option objects. Slide *chrome* does not,
      and that asymmetry is what forces the split:
        - `ThemeProps` exposes 12 clrScheme slots + 6 font faces. A real theme part also
          carries `<a:fmtScheme>` (3 fill / 3 line / 3 effect / 3 bg-fill styles) and
          nothing on the write path sets it. Any source shape whose look comes from
          `<p:style>` -> fmtScheme references must therefore be flattened to explicit
          fill/line/effect props.
        - `SlideMasterProps.textStyles` are deck-wide and last-wins, because a generated
          deck has a single shared master. A source deck with multiple masters has no
          structural counterpart.
      Hence tier B (template-anchored) rides `Presentation.fromTemplate` +
      `appendSlides`, keeping the source deck's masters/layouts/theme byte-identical and
      re-authoring only slide bodies; the emitted script carries the source deck as a
      binary asset. Tier A (standalone) emits `new TsPptx()` + `defineSlideMaster` and
      depends on this package alone, approximating chrome and collapsing multi-master
      decks. Tier B ships first: it rides primitives that already exist and are tested.

      ARCHITECTURE: read model -> deck IR -> printed text. Never read model -> text
      directly. The IR is serializable, holds no read-model object references and no DOM,
      and is roughly `{ deck, slides: [{ layout, background, calls: [{ method, args }] }] }`
      with `args` as literal write-API option objects. Every dropped or approximated
      construct appends a fidelity note to the IR (`{ slideNumber, shapeName, construct,
      disposition: dropped | flattened | approximated, detail }`) rather than warning to
      the log. That makes the round-trip oracle a *projection diff*: a noted field is
      contractually excluded from the diff, so a surprise diff on an un-noted field is a
      real bug. Byte identity is explicitly not the oracle.

      MEDIA: extracted to files by default (`./assets/image1.png`), with an opt-in for
      inlining on tiny decks/fixtures. The emitter returns `{ code, assets }`.

      TIER B's LOSS LIST (measured 2026-07-26, not assumed — an earlier version of this
      list was copied from a doc comment and two of its five items were already stale):
        1. No placeholder inheritance, but the loss is SEMANTIC, not visual. A source
           placeholder's geometry is reproduced exactly, because the write path emits
           `<p:ph>` and an explicit `<a:xfrm>` together — placeholder identity and
           geometry were never alternatives. What degrades is the application's
           recognition of the shape as a specific layout placeholder (outline view,
           "Reset Slide", accessibility checker), plus inherited geometry now being
           frozen. `PlaceholderType` covers 6 of the 16 `ST_PlaceholderType` values and
           an unrecognised one degrades to an untyped `<p:ph>`; there is no public setter
           for `idx`.
        2. Colours split 10/7, they are not uniformly flattened. The write path accepts
           `ThemeColor`, and in tier B destination theme == source theme by construction,
           so the 10 clrMap-mapped tokens (tx1 tx2 bg1 bg2 accent1..6) pass straight
           through as `schemeClr` — equivalent AND theme-responsive. The other 7
           `ST_SchemeColorVal` tokens (dk1 lt1 dk2 lt2 hlink folHlink phClr) are not
           accepted and are silently repainted 000000, so those must be resolved to hex
           against the theme, each with a fidelity note. Tier A flattens all 17.
        3. Speaker notes: no longer a loss. `addNotes` content now rides across as a real
           notesSlide part, with a notes master installed when the destination lacks one.
        4. Embedded and online A/V: no longer a loss (see dn-append-av-media below).
        5. Slide sizes must match — trivially true, same deck.
      Charts are carried across wholesale (chart XML + rels + embedded workbook injected
      under fresh names), which makes "pass the chart part through" both cheaper and
      higher-fidelity than transcribing `addChart` calls in tier B. Internal `slide:N`
      hyperlinks are repointed, and throw if the target is outside the appended batch.

      GEOMETRY PRECISION is settled, not a printer judgement call. `Coord`-typed options
      accept raw `"<n>emu"` and reach `a:off`/`a:ext` unrounded, so the printer emits EMU
      verbatim everywhere except `colW`/`rowH`/`margin`, which are typed inches. Those
      are NOT a precision loss: EMU -> inches -> EMU is the identity at full double
      precision. The loss appears only if the printed decimal is truncated, and 6 decimal
      places is the provable minimum (a 6-decimal round shifts the value by <= 0.4572
      EMU, inside the half-EMU bound; at 5 decimals the bound is 4.572 EMU and the
      round-trip fails for most values). Rounding below 6 to suppress cosmetic
      `0.5000000001` noise would be a real geometry loss.

      RELATED LEDGER ENTRIES, both since implemented and pruned, so neither blocks this:
      `dn-append-av-media` (embedded then online A/V across the append path) and
      `dn-freeform-arcto`. The latter is the closest prior art — its resolution removed a
      phantom arc end point that OOXML does not carry, specifically so a read -> write
      converter maps `arcTo` one-to-one with no solver and no invented data.

      THE UNMEASURED HALF is the read side, and it is the actual risk. A write-API gap is
      visible loss — a converter sees the construct and can report it. A read-API gap is
      invisible: nothing upstream knows the element was there, so a round-trip diff comes
      back clean and certifies a deck it never inspected. A census over the fixture corpus
      found 18 element qnames whose namespace appears nowhere in the read path (hence
      unreachable by any accessor without a source change) and 53 more that no accessor
      names. Concretely: bullet font/colour/size are unread (only the glyph is read),
      custGeom guides / adjust handles / connection sites are unread, and OMML math is
      unreachable. Note the corpus is construct-targeted, so it measures COVERAGE, not
      frequency — it cannot rank what to fix first.
    evidence:
      kinds:
        - local-source-inspection
        - regression-test
      local_files:
        - src/script.ts
        - src/script/ir.ts
        - src/script/fidelity.ts
        - src/script/print/script.ts
        - src/script/print/standalone.ts
        - src/script/verify/diff.ts
        - scripts/script-roundtrip.mjs
        - docs/reference/pptx-to-script.md
        - test/read/script-roundtrip.test.js
        - test/read/script-standalone.test.js
      schema_fixture: null
      validator_result: null
      powerpoint_result: null
      spec_refs: []
    next_action: none
  - id: dn-xml-attr-whitespace
    source: downstream
    type: downstream-need
    first_seen: 2026-07-27
    last_reviewed: 2026-07-27
    status: implemented
    priority: p2
    target_area:
      - typescript-api
    applies_to_current_project: yes
    non_target_reasons: []
    summary: A tab, CR or LF inside a value written to an XML attribute (layout title, objectName, altText, section title) is emitted literally and normalised to a space on read
    current_project_notes: |
      IMPLEMENTED. XML 1.0 section 3.3.3 normalises a literal tab, carriage return or line feed
      inside an attribute value to a single space before any consumer sees it; carrying one
      across requires a character reference (&#9;, &#13;, &#10;). `encodeXmlEntities`
      (src/gen-utils.ts) escapes &, <, >, " and ' and strips illegal control characters, but
      passed tab/CR/LF through literally, so any caller-supplied string that landed in an
      attribute came back with its line breaks turned into spaces.

      The fix is `encodeXmlAttrValue` (src/gen-utils.ts), layered over `encodeXmlEntities` and
      used by the attribute-emitting paths ONLY. It was deliberately not a widening of
      `encodeXmlEntities`, which also escapes element *text*, where a literal newline is
      meaningful content: escaping there would be a broad byte change across every text-bearing
      part, which the byte-identity gate treats as a stop rather than a cleanup.

      Where it is wired:
        - `openTag()` in src/gen/oxml/el.ts — one change covering every attribute emitted
          through the element builder (p14:section/@name, a:hlinkClick/@tooltip,
          p:cmAuthor/@name and @initials, tableColumn/@name in the embedded xlsx, ...).
        - `cNvPrOpen` (@descr) and `p:cSld/@name` in src/gen/slide/object.ts, which build
          attributes with template strings rather than the builder.
        - The ten `objectName` pre-escape sites in src/gen/define/*.ts. `objectName` is escaped
          once upstream at define time and emitted raw by `cNvPrOpen`, so the escaper had to
          change there rather than at emission — and with it the two lookup keys that compare
          against the STORED escaped name (connector.ts `resolveCxn`) or against emitted bytes
          (the media rel-target probe in object.ts), which silently drift otherwise.
        - `escapeXmlAttribute` in src/read/oxml/dom.ts, the read side's counterpart helper
          (content types and relationships), which had the same defect.

      Gates: byte-identical across all 1637 parts of the demo deck (the change is inert for any
      deck without those characters); schema fixture `dn-xml-attr-whitespace` in
      test/schema-cases.js, which also sweeps every attribute of every XML part in the package
      for a surviving literal tab/CR/LF; write→read fidelity in
      test/read/attr-whitespace-roundtrip.test.js, asserted through a real parser rather than a
      byte match, because the defect is exactly that the bytes look fine and the parse loses.

      Real-world reach is narrow but not theoretical: PowerPoint's own built-in German layout
      set contains a layout named across two lines ("Abschnitts-<LF>uberschrift"), so a deck
      created from it already exercises the case.

      ADJACENT DEFECT FOUND, NOT FIXED HERE (filed as dn-animation-objectname-escaping): the
      same store-escaped/compare-escaped design means `addAnimation({ objectName })` compares a
      RAW caller string against the stored escaped name, so an animation targeting a shape whose
      name contains `&`, `<` or `"` is silently dropped today. Pre-existing and independent of
      this change.
    evidence:
      kinds:
        - local-source-inspection
        - ooxml-reference
        - regression-test
        - schema-fixture
        - validator-result
      local_files:
        - src/gen-utils.ts
        - src/gen/oxml/el.ts
        - src/gen/slide/object.ts
        - src/gen/define/connector.ts
        - src/read/oxml/dom.ts
        - test/read/attr-whitespace-roundtrip.test.js
        - test/schema-cases.js
