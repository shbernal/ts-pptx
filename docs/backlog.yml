    summary: Bake normAutofit fontScale for wrap=false text that overflows its box horizontally (single-line width)
    current_project_notes: |
      Extends the measured-text-fit shrink solver to the horizontal (width) axis.

      Background: for `fit:'shrink'`, the measured-fit pass already bakes a real
      `fontScale` onto `<a:normAutofit>` when a font's metrics are registered — but
      only for VERTICAL overflow (text taller than the box height). `normAutofit` is
      architecturally a vertical mechanism, so a `wrap:false` (`wrap="none"`) frame
      never triggers it: a single unwrapped line always fits the box HEIGHT, so the
      solver reports "fits" and bakes no scale, and the line simply runs out of the
      box sideways. PowerPoint draws the baked scale (here 100%) and overflows;
      LibreOffice re-derives shrink-to-fit at render time and scales the line to the
      frame, so the same deck looks correct there and ships broken to a PowerPoint
      audience — a silent PowerPoint-vs-LibreOffice divergence.

      Reproduction (any consumer): a text box with `fit:'shrink'`, `wrap:false`, a
      fixed width, and a single line of text wider than the inner box, with the run's
      font metrics registered via `registerFontMetrics`. Expected: the widest
      non-wrapping line is shrunk to fit the box width and a `<a:normAutofit
      fontScale=…/>` is emitted. Actual (before fix): bare `<a:normAutofit/>`.

      Design: carry the frame's wrap mode onto the shrink solver's `FitBox`
      (`text-fit.ts`). When not wrapping, lay text out unbounded (one line per
      paragraph, as the height path already does) and, in `solveShrink`, additionally
      require the widest laid-out line to fit `innerWidthPt` — searching the same
      2.5% fontScale grid, conservative (width already inflated by WIDTH_SAFETY_FACTOR)
      so the baked scale never overflows PowerPoint. `computeBox`/`solveResize`
      (`measure-fit.ts`) pass the wrap flag instead of collapsing the non-wrapping
      width to Infinity. Backward compatible: the wrapping table-cell and
      `measureText` paths default to wrap=true and are unchanged. Supersedes, for the
      metrics-registered case, the "fontScale deliberately omitted" caveat recorded in
      dn-doc-render-caveats (that caveat now describes only the no-metrics fallback).

      IMPLEMENTED (2026-07-16): `FitBox` gained a `wrap` flag; `solveShrink` lays a
      non-wrapping frame out unbounded and additionally requires the widest laid-out
      line to fit `innerWidthPt` on the 2.5% grid; `computeBox`/`solveResize` pass the
      flag. Deterministic unit coverage in test/regression/text-fit.test.mjs
      ("solveShrink wrap=false (horizontal overflow)") plus an end-to-end
      registerFontMetrics assertion in test/regression/measured-fit-integration.test.mjs.
      Full suite green (1091 regression/read/schema tests).
    constructs:
      - autofit-shrink
    evidence:
      kinds:
        - local-source-inspection
        - regression-test
      local_files:
        - src/text-fit.ts
        - src/measure-fit.ts
