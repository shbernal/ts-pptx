  - id: fork-units-pt-vs-inches
    source: fork:src/core-interfaces.ts
    type: fork-internal-proposal
    first_seen: 2026-07-03
    last_reviewed: 2026-07-03
    status: deferred
    priority: p2
    target_area:
      - typescript-api
    applies_to_current_project: no
    non_target_reasons: []
    summary: Size/spacing props are expressed in points while the positional API uses inches; reconsider unifying on one unit
    current_project_notes: |
      The library's positional API (x/y/w/h) is in inches, but several size/spacing
      properties have "always been points" and PowerPoint's own UI shows them in
      inches. This mismatch is a footgun (a caller reading the PPT dialog enters an
      inch value that the library treats as points). Recorded from the comment-cleanup
      pass that removed the stale, version-numbered inline `// TODO ... update in v4.0`
      notes at these sites; the units question was explicitly left open by the
      deprecated-alias removal commit rather than resolved.

      Affected props (all currently points):
      - TextBaseProps `margin` (src/core-interfaces.ts, was the `[20220219]` TODO)
      - shadow `offset` (PPT UI: "Distance") and `blur` (ShadowProps)
      - `margin?: Margin` on the "margin (points)" interface (~L3027)
      - border `pt` — the PPT-aligned `width` alias is now IMPLEMENTED (see
        fork-transparency-width-props); `pt` remains as a deprecated alias pending
        removal. This item still owns the units *policy* decision and the eventual
        `pt` drop.

      Companion: table cell margins have their own magnitude heuristic tracked
      separately in dn-table-cell-margin-units. A unified fix would ideally settle the
      whole-API unit story (accept inches, or accept a typed unit, warn on the legacy
      points path) rather than fixing cell margins in isolation. Breaking change; needs
      a migration note in CHANGELOG when scheduled.
