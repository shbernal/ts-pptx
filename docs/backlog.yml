    current_project_notes: >
      Left behind by the module split that took presentation.ts from 2475 to 1735 lines.
      A state-coupling map of all ~50 class members showed the class has only three
      genuinely private fields: #presentationPart (read solely by its own public getter),
      #importRegistry, and #rescaledParts. Because `opc` is a public readonly field and
      `presentationPart` a public getter, most "private" methods are not state-entangled at
      all, which is what made the types/DOM/rescale/table-styles extractions mechanical.
