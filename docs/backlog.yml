schema: 1
# Upstream issue/PR tracking has been retired. This fork no longer fetches or
# reconciles against gitbrent/PptxGenJS; `source_repo` is kept only as provenance
# for the github-derived entries already recorded below.
source_repo: gitbrent/PptxGenJS
purpose: >
  The fork's project backlog ledger. It records work this project intends to do
  and decisions it has made: `downstream-need` items for generic PPTX behavior a
  downstream consumer needs that belongs in this package; `fork-internal-proposal`
  items for API-evolution / breaking-change candidates the fork proposes for itself
  (not driven by a downstream consumer or an upstream issue); plus a set of retained
  upstream-derived signals from gitbrent/PptxGenJS that were judged relevant before
  upstream tracking was retired. New entries are project needs or fork proposals.
  Downstream needs are recorded generically: describe the missing PPTX behavior and
  its generic reproduction, never a private consumer's name, files, or content. The
  `source` field carries a github reference (owner/repo#N or a github.com
  issues/pull URL) for the retained legacy entries, `downstream` for downstream
  needs, or `fork[:path]` for fork-internal proposals (path points at the source
  file in THIS repo the proposal concerns). This file is no longer synced against
  GitHub; the upstream reconciliation tooling has been removed.
project_target_docs:
  - docs/project-target.md
  - docs/runtime-and-package-support.md
  - docs/agent-development.md
  - docs/ooxml-agent-context.md
  - docs/testing.md

# MAINTENANCE (agents):
# - Every vocabulary-constrained field (status, priority, target_area,
#   applies_to_current_project, non_target_reasons, evidence.kinds) must use a value
#   already listed under `vocabulary:` below. Reuse the closest existing term; never
#   invent a synonym (e.g. `validator-pass` instead of `validator-result`).
# - If nothing fits, ADD the new value to the relevant `vocabulary:` list in the same
#   edit (note why), then use it — extending the vocabulary on purpose is fine, drifting
#   off it by typo is not.
# - After ANY edit to this file, run `pnpm run backlog:validate` and fix every
#   error before committing. The validator keys on the `vocabulary:` lists in THIS file.
# - `source` must be consistent with `type`: issue/pull-request entries need a github
#   reference; downstream-need entries need `downstream`; fork-internal-proposal
#   entries need `fork` or `fork:<path>`.
#   New downstream needs / fork proposals are easiest to add with
#   `pnpm run backlog -- add` (see --help).
# - Downstream needs are ANONYMOUS. Never write a private consumer's name, its file
#   paths, deck/client names, or its content into any entry. Describe only the
#   generic PPTX gap and how any consumer would reproduce it.

vocabulary:
  statuses:
    - needs-repro
    - target
    - accepted
    - interesting-with-tweaks
    - non-target
    - watch
    - deferred
    # on-hold: a deliberate, owner-gated parking. Unlike `deferred` (which routine
    # review may re-raise on its own), an on-hold item must NOT be proposed or
    # re-raised until the maintainer explicitly green-lights it.
    - on-hold
    - implemented
    - partially-implemented
    - superseded
  priorities:
    - p0
    - p1
    - p2
    - p3
    - none
  target_areas:
    - powerpoint-repair
    - invalid-ooxml
    - schema-order
    - relationship-or-content-type
    - chart-ooxml
    - table-ooxml
    - image-svg-media
    - speaker-notes-masters-layouts
    - missing-pptx-feature
    - typescript-api
    - browser-modern-esm
    - package-boundary
  applies_to_current_project:
    - yes
    - partial
    - no
    - unknown
  non_target_reasons:
    - commonjs
    - iife-global
    - cdn-script-tag
    - legacy-dist-artifact
    - unsupported-runtime
    - upstream-build-system
    - release-matrix
    - docs-only-for-legacy-workflow
    - existing-pptx-import
    - not-reproducible-in-current-project
    - insufficient-evidence
    - out-of-project-scope
    - escape-hatch-footgun
  evidence_kinds:
    # Source / spec reading
    - local-source-inspection
    - ooxml-reference
    - microsoft-reference
    # Reproduction artifacts
    - minimal-repro
    - generated-pptx
    - extracted-xml
    # Automated tests / validation
    - regression-test
    - schema-fixture
    - validator-result
    # Performance measurement (timing/throughput spike, not a correctness test)
    - benchmark
    # Application-render verification
    - render-check
    - powerpoint-result
    - powerpoint-authored-comparison
  constructs:
    # OOXML construct identity for a downstream replication capability audit. An
    # entry tags the OOXML construct(s) it gates so a consumer can join
    # detected-construct -> gating-entry -> live status directly off this ledger,
    # with no hand-curated construct map. Keys are the stable detector keys; the
    # comment names the DrawingML element each identifies.
    - gradient-fill #         <a:gradFill> shape fill
    - gradient-line-stroke #  <a:gradFill> inside <a:ln>
    - custom-geom #           <a:custGeom> freeform geometry
    - preset-geom-exotic #    non-trivial <a:prstGeom> presets (blockArc/homePlate/textArch*)
    - text-warp #             <a:prstTxWarp> preset text warp
    - connector #             <p:cxnSp> connector autoShape
    - outer-shadow #          <a:outerShdw> drop shadow
    - bullet-char #           <a:buChar> symbol bullet
    - bullet-autonum #        <a:buAutoNum> auto-number bullet
    - group-scale #           scaled group (chOff/chExt vs off/ext)
    - group-rot-flip #        group <a:xfrm> @rot/@flipH/@flipV
    - autofit-shrink #        <a:normAutofit> shrink-to-fit text
    - autofit-resize #        <a:spAutoFit> resize-to-fit text (added 2026-06-21 for the measured-text-fit oracle)
    - vertical-text #         <a:bodyPr vert="…"> text direction
    - style-ref-color #       <p:style> <a:fillRef>/<a:lnRef> theme colour
    - blip-fill-shape #       <a:blipFill> as the fill of a <p:sp>
    - slide-transition #      <p:transition> slide transition (added 2026-06-26 for docs/animations-and-transitions.md)
    - build-animation #       <p:timing>/<p:bldLst> per-shape build animation (added 2026-06-26 for docs/animations-and-transitions.md)

item_fields:
  id: stable local identifier; upstream-issue-N / upstream-pr-N for upstream, dn-<slug> for downstream-need, fork-<slug> for fork-internal-proposal
  source: github reference (owner/repo#N or github.com issues/pull URL) for upstream; "downstream" for downstream-need; fork[:path] for fork-internal-proposal
  type: issue, pull-request, downstream-need, or fork-internal-proposal
  first_seen: ISO date when recorded locally
  last_reviewed: ISO date when last classified
  status: one vocabulary.statuses value
  priority: one vocabulary.priorities value
  target_area: list of vocabulary.target_areas values
  applies_to_current_project: one vocabulary.applies_to_current_project value
  non_target_reasons: list of vocabulary.non_target_reasons values
  summary: short one-line summary
  constructs: optional; list of vocabulary.constructs OOXML construct keys this entry gates (read by a downstream replication capability audit)
  current_project_notes: local decision note; for downstream-need, the full generic design rationale belongs here (no private consumer names/paths/content)
  evidence: local evidence gathered against this checkout
  next_action: next local action or none

# Add an upstream item by hand following the example below. Add a downstream-need
# the easy way with `pnpm run backlog -- add` (see --help), then write its generic
# design rationale into current_project_notes as a block scalar.
#
# items:
# - id: upstream-issue-1234
#   source: gitbrent/PptxGenJS#1234
#   type: issue
#   first_seen: 2026-06-07
#   last_reviewed: 2026-06-07
#   status: interesting-with-tweaks
#   priority: p1
#   target_area:
#     - powerpoint-repair
#     - invalid-ooxml
#   applies_to_current_project: partial
#   non_target_reasons: []
#   summary: PowerPoint repair report for a generated chart.
#   current_project_notes: >
#     The behavior may apply, but the upstream fix also touches legacy package
#     artifacts. Re-evaluate only the emitted OOXML behavior.
#   evidence:
#     kinds: []
#     local_files: []
#     schema_fixture: null
#     validator_result: null
#     powerpoint_result: null
#     spec_refs: []
#   next_action: create-minimal-repro
items:
  - id: upstream-issue-1423
    source: "gitbrent/PptxGenJS#1423"
    type: issue
    first_seen: 2026-06-07
    last_reviewed: 2026-06-19
    status: non-target
    priority: none
    target_area:
      - chart-ooxml
    applies_to_current_project: no
    non_target_reasons:
      - insufficient-evidence
    summary: Reports that manually adding a new dimension in the embedded Excel data does not update chart display.
    current_project_notes: >
      Reviewed 2026-06-19 against the generator. Charts emit a fixed reference range
      (e.g. <c:f>Sheet1!$A$2:$A$N</c:f>) sized to the supplied data, plus a matching
      numCache/strCache — standard, valid OOXML. A chart only plots what its c:f range
      covers; manually inserting a row in the embedded worksheet does NOT auto-extend
      that range in any viewer (auto-expansion is an Excel "Table"/structured-reference
      feature, not default chart behavior). So the reported "defect" is expected
      fixed-range behavior, not a generator bug, and the screenshot-only report shows
      no malformed range/cache. Marked non-target/insufficient-evidence. Reopen only
      if a repro shows the emitted c:f range or cache is itself malformed.
    evidence:
      kinds:
        - local-source-inspection
      local_files:
        - src/gen-charts.ts:973
        - src/gen-charts.ts:992
      schema_fixture: null
      validator_result: null
      powerpoint_result: null
      spec_refs: []
    next_action: none

