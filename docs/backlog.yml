    summary: Asked for a semi-circle chart derived from pie or doughnut charts.
    current_project_notes: >
      Reviewed 2026-06-20: not a library gap. PowerPoint/OOXML has no native
      half-pie or half-doughnut chart type; a semicircle is authored by data
      shaping — adding a hidden slice equal to the visible total and rotating it
      out of view. The library already exposes the controls this needs:
      firstSliceAng (core-interfaces.ts:2588) to rotate the gap to the bottom and
      holeSize (core-interfaces.ts:2519) for the doughnut variant, plus per-slice
      no-fill via chartColors. So the authoring need is met with existing
      primitives and no ts-pptx feature is required; there is no authored-XML
      evidence of a distinct OOXML construct to target.
    evidence:
      kinds:
