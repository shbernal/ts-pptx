  - id: fork-addtext-objectname-double-escape
    source: fork:src/gen/define/text.ts
    type: fork-internal-proposal
    first_seen: 2026-07-20
    last_reviewed: 2026-07-20
    status: implemented
    priority: p3
    target_area: []
    applies_to_current_project: yes
    non_target_reasons: []
    summary: "Slide.addText(string, {objectName}) double-escapes objectName: 'Q&A' emits name=\"Q&amp;amp;A\" instead of \"Q&amp;A\""
    current_project_notes: |
      Found while re-verifying a Phase 2 write-side-migration memory note that had
      mischaracterized this construct as objectName reaching <p:cNvPr name>/
      <p:cSld name> UNESCAPED. That characterization is wrong for the real public
      API: every add*Definition (text.ts, shape.ts, image.ts, chart.ts, media.ts,
      connector.ts, group.ts, table.ts) already escapes objectName once via
      encodeXmlEntities(validateObjectName(...)) before storing it, and cNvPrOpen
      (src/gen/slide/object.ts) correctly writes it out raw afterward. Verified
      empirically with a probe script against the real public API: calling
      addText('hi', {objectName:'Q&A'}) and reading back ppt/slides/slide1.xml
      shows name="Q&amp;amp;A" -- double-escaped, not raw.

      Root cause: Slide.addText(text, options) (src/slide.ts) wraps a bare string
      as [{ text, options }], reusing the SAME object reference as both the
      per-run options and the opts argument passed to addTextDefinition. Inside
      addTextDefinition (src/gen/define/text.ts), cleanOpts() runs once on the
      shape-level options (STEP 1, escaping objectName), then runs again per text
      run (STEP 2's forEach) -- for the single-string call form this is the same
      object, already carrying the escaped value, so objectName is escaped a
      second time. The array form addText([{text:'a'},{text:'b'}], opts) does not
      hit this (individual runs don't normally carry their own objectName).

      Result is well-formed XML with a wrong value (not a PowerPoint-repair
      corruption case), scoped to objectName values containing XML
      metacharacters via the single-string addText() convenience form. Pre-dates
      the Phase 2 el()/voidEl() migration; unrelated to it.

      The existing characterization test test/regression/slide-object-xml.test.mjs
      ("objectName is NOT escaped" / "the slide name is NOT escaped either")
      constructs slide objects directly, bypassing the define layer, so it never
      exercises this real path -- its comments repeat the same wrong "unescaped"
      framing and should be corrected alongside any fix.

      See also fork-slidemaster-title-unescaped for a related but distinct and
      genuinely unescaped construct (defineSlideMaster's title), found in the
      same investigation.

      FIXED 2026-07-20. The `objectName` block (encodeXmlEntities(validateObjectName(...)))
      was moved out of `cleanOpts` in src/gen/define/text.ts, where it ran once for the
      shape-level options AND once per text run, and now runs exactly once against
      `newObject.options` right after the shape-level `cleanOpts` call (new STEP 1a).
      `cleanOpts` is still called per run for genuinely per-run concerns (color,
      _bodyProp, etc.), but no longer touches objectName at all -- per-run objectName was
      already dead data downstream (nothing reads `item.options.objectName` for an
      individual text run; only the shape-level `newObject.options.objectName` reaches
      cNvPrOpen), so removing it from the per-run pass changes no observable behavior
      besides fixing the double-escape. This fixes the bug regardless of the
      Slide.addText aliasing that triggered it, without touching src/slide.ts.

      Also corrected the misleading "reaches the file raw / LATENT BUG" comments in
      cNvPrOpen (src/gen/slide/object.ts) and in
      test/regression/slide-object-xml.test.mjs's escaping describe block, which had
      mischaracterized cNvPrOpen's deliberate non-escaping of `name` as an unescaped-input
      bug rather than a single-escape-upstream design (see current_project_notes above).
      Added a regression test,
      "addText(string, {objectName}) escapes objectName exactly once", to
      test/regression/object-identity.test.js, asserting `name="Q&amp;A"` and the absence
      of `&amp;amp;`. Full suite (1410 tests) green after the fix.
    constructs: []
    evidence:
      kinds:
        - local-source-inspection
        - minimal-repro
        - regression-test
      local_files:
        - src/slide.ts
        - src/gen/define/text.ts
        - src/gen/slide/object.ts
        - test/regression/slide-object-xml.test.mjs
        - test/regression/object-identity.test.js
      schema_fixture: null
      validator_result: null
      powerpoint_result: null
      spec_refs: []
    next_action: none

  - id: fork-slidemaster-title-unescaped
    source: "fork:src/pptxgen.ts"
    type: fork-internal-proposal
    first_seen: 2026-07-20
    last_reviewed: 2026-07-20
    status: implemented
    priority: p2
    target_area:
      - invalid-ooxml
      - powerpoint-repair
    applies_to_current_project: yes
    non_target_reasons: []
    summary: "defineSlideMaster({title}) is never escaped, so a title containing XML metacharacters emits a non-parseable <p:cSld name=...> in the slideLayout part"
    current_project_notes: |
      Found alongside fork-addtext-objectname-double-escape, while re-verifying a
      Phase 2 write-side-migration memory note. Unlike that entry, this half of
      the original claim held up: src/pptxgen.ts:1343 (defineSlideMaster) sets
      _name: propsClone.title directly, with no encodeXmlEntities call anywhere
      on that path. Verified empirically: defineSlideMaster({title:'R&D'}) +
      addSlide({masterName:'R&D'}) emits ppt/slideLayouts/slideLayout2.xml
      containing <p:cSld name="R&D">, unescaped -- a title containing '&', '<',
      or '"' would produce a non-well-formed part (PowerPoint repair territory),
      not merely a wrong value.

      slide.ts's own default _name ("Slide N") is never caller-controlled, so
      this is specific to the defineSlideMaster(title) path.

      FIXED 2026-07-20. Escaping was deliberately NOT added at the
      `_name: propsClone.title` assignment (src/pptxgen.ts) as the next_action
      below originally suggested, because `_name` doubles as the raw lookup key
      `addSlide({masterTitle: '...'})` / the deprecated `masterName` match
      against the caller's unescaped title (`layout._name === masterSlideName`,
      src/pptxgen.ts). Escaping it that early would break the lookup for any
      title containing `&`/`<`/`"` while fixing the XML. Instead, `_name` is now
      escaped at the single point it becomes XML: `slideObjectToXml`
      (src/gen/slide/object.ts), `'<p:cSld name="' + encodeXmlEntities(slide._name) + '">'`.
      This is the mirror image of `cNvPrOpen`'s objectName design (escape once
      upstream, emit raw) -- here escaping has to happen downstream instead,
      because the raw value is load-bearing for matching in between.

      Updated the stale characterization test in
      test/regression/slide-object-xml.test.mjs ("the slide name is NOT escaped
      either") to assert the new escaped behavior, and its describe-block header
      comment. Added a regression test, "a title with XML metacharacters is
      escaped in the slideLayout and still matches masterTitle raw", to
      test/regression/addslide-mastertitle.test.js, asserting both the escaped
      `<p:cSld name="R&amp;D &lt;Team&gt; &quot;Q1&quot;">` and that
      `addSlide({masterTitle})` lookup still resolves against the raw title.
      Full suite (1411 tests) green after the fix; typecheck clean.
    constructs: []
    evidence:
      kinds:
        - local-source-inspection
        - minimal-repro
        - regression-test
      local_files:
        - src/pptxgen.ts
        - src/gen/slide/object.ts
        - test/regression/slide-object-xml.test.mjs
        - test/regression/addslide-mastertitle.test.js
      schema_fixture: null
      validator_result: null
      powerpoint_result: null
      spec_refs: []
    next_action: none -- fixed; a schema fixture exercising a title with XML metacharacters would still be worth adding under the same pattern as the theme/fontFace/rel-Target escaping fixtures

