  - id: fork-chart-counter-nondeterminism
    source: fork:src/gen-objects.ts
    type: fork-internal-proposal
    first_seen: 2026-07-17
    last_reviewed: 2026-07-17
    status: implemented
    priority: p3
    target_area:
      - chart-ooxml
    applies_to_current_project: yes
    non_target_reasons: []
    summary: _chartCounter is a never-reset module global, so two identical presentations built in one process emit different chart part filenames (same input, different bytes)
    current_project_notes: |
      IMPLEMENTED 2026-07-17. Chart part filenames are now assigned from a
      per-presentation counter at write time, not from a process-global.

      Root cause: `_chartCounter` was a module-level `let` in `gen-objects.ts`
      incremented in `addChartDefinition` and never reset, so two identical decks
      built in one process got different chart part filenames (chart1/chart2 vs
      chart3/chart4) — same input, different bytes.

      Fix (chosen over threading a counter through `Slide`, which would not have
      covered charts added to masters/layouts and would have collided across a
      mid-deck `pptx.layout=` change): removed the module global entirely and made
      `exportPresentation` the single authoritative assigner. Right after the
      existing media-dedup pass, a per-presentation loop walks every chart-bearing
      target (`[...slides, ...slideLayouts, master]` — one shared `ppt/charts/`
      namespace) and renumbers `globalId`/`fileName`/`Target` from 1. That pass runs
      before content-types, slide rels, and the chart/embedding parts, the only
      consumers of those fields in the write path (the append/`extractSlides` path
      rejects charts in v1 and identifies them by per-slide rId, not globalId).
      `addChartDefinition` now sets only a target-local placeholder id. The counter
      is local to each `exportPresentation` call, so filenames are a pure function of
      deck structure and stable across re-exports of the same presentation.
    constructs: []
    evidence:
      kinds:
        - local-source-inspection
        - regression-test
      local_files:
        - src/gen-objects.ts
        - src/pptxgen.ts
        - test/regression/chart-part-name-determinism.test.js
