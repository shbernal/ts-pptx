    summary: addTable with autoPage raised an Array expected error in an HTML-table workflow.
    current_project_notes: >
      Reviewed 2026-06-19. The "Array expected" throw is the well-formedness guard
      in addTableDefinition (STEP 1) and it fires before autoPage, so the failure is
      upstream in tableToSlides' HTML→rows conversion (a malformed/empty row reaching
      addTable), not in pagination. genTableToSlides reads a live HTML <table> via
      the browser DOM, which docs/project-target.md lists as a live-DOM/browser-layout
      feature that is out of active scope and cannot be reproduced in the Node test
      suite. The supported, fully-tested path — direct addTable(rows, { autoPage })
      with array rows — paginates correctly (see table-autopage-* regression suites).
      Marked non-target/out-of-project-scope. Contributions welcome: a headless-browser
      (Playwright/Puppeteer) repro of genTableToSlides would make this actionable.
    evidence:
      kinds:
        - local-source-inspection
      local_files:
        - src/gen-objects.ts:1090
