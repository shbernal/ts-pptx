      tick-label position is emitted as
      `<c:tickLblPos val="${opts.serAxisLabelPos || opts.barDir === 'col' ? 'low' : 'nextTo'}"/>`.
      JS precedence binds `===` tighter than `||`, and `||` tighter than `?:`, so this
      parses as `(opts.serAxisLabelPos || (opts.barDir === 'col')) ? 'low' : 'nextTo'` --
      the option is used only as a truthiness test, never as a value. Any truthy
      serAxisLabelPos ('none' | 'low' | 'high' | 'nextTo', declared at
      src/types/chart.ts:364) therefore emits val="low"; setting 'high' or 'nextTo'
      silently does the opposite of what was asked. Only the unset case behaves
      correctly. Intended logic is almost certainly
      `opts.serAxisLabelPos || (opts.barDir === 'col' ? 'low' : 'nextTo')`.
