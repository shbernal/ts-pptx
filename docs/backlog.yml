    current_project_notes: |
      IMPLEMENTED 2026-06-24. `defineSlideMaster()` gained an optional `textStyles`
      (SlideMasterProps.textStyles: MasterTextStyleProps) that configures the shared
      slide master's per-level `<p:txStyles>` — `title` (single level), `body[]`, and
      `other[]` (each up to 9 list levels, index 0 == lvl1). Per level
      (MasterTextStyleLevel): fontSize (pt), fontFace, color (hex|theme), bold, italic,
      align, marginLeft + indent (INCHES -> EMU via inch2Emu), and bullet
      (false -> <a:buNone/>; MasterBulletProps for char/auto-number).

      Serialization: makeXmlMaster (src/gen-xml.ts) now emits
      `slide._txStyles ? makeXmlMasterTxStyles(slide._txStyles) : <verbatim default literal>`,
      so a deck that does not set textStyles is BYTE-IDENTICAL to before (regression-guarded).
      makeXmlMasterTxStyles layers caller overrides onto data-model defaults
      (MASTER_TITLE_DEFAULT / MASTER_BODY_DEFAULTS / MASTER_OTHER_DEFAULTS mirroring the
      Office literal) via masterLevelXml/masterBulletXml; unset fields keep the level
      default. Levels past 9 warn and are dropped; invalid fontSize warns and keeps the
      default (warn-over-coerce). txStyles lives on the single shared master, so it is
      deck-wide: defineSlideMaster routes textStyles to `this._masterSlide._txStyles`
      (SlideBaseProps._txStyles) with per-group last-call-wins merge (src/pptxgen.ts).

      Validator-clean (legacy txStyles is fully standard-specified; no PowerPoint oracle
      needed). Out of scope for this pass (no concrete need): new placeholder/style groups
      beyond title/body/other, and picture bullets in master defaults (need slide rels).
