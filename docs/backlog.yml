    summary: "pptx-to-script drops a surface's picture fill: the read model now sees it, but from-read's fill mappers carry no AssetResolver to re-embed the image with."
    current_project_notes: >
      Opened when the read side gained picture-fill accessors (dn-read-cell-picture-fill,
      2026-07-28). A shape or table cell whose surface is an `a:blipFill` was fully readable
      and the write API could author one (`fill: { type: 'image', image: { data } }`), but
      the converter's fill mappers carried no `AssetResolver`, so an image-filled surface
      converted to a script and came back unfilled.

      Implemented: the mapping now lives in src/script/from-read/picture-fill.ts, shared by
      `fillOption` (src/script/from-read/shape.ts) and `cellFill`
      (src/script/from-read/table.ts) — the two are the same construct read from two
      containers, and `TableCellProps.fill` is a `ShapeFillProps` like a shape's. The
      resolver is threaded shapeCall → autoShapeCall → styleOptions → fillOption and
      graphicFrameCall → tableCall → cellIr → cellFill. Bytes carry as an asset (deduped
      against every other reference to the part) and the blip's `a:alphaModFix` carries as
      `transparency`; a fully opaque fill emits no `transparency` key, since the write path
      emits no `a:alphaModFix` for a zero and the round trip would see a difference the
      picture does not have.

      `AssetResolver` gained `contentTypeOf(partName)` so a fill can reject a part *before*
      registering it: the write path refuses an SVG picture fill outright
      (src/gen/define/image.ts warns and falls back to `type: 'none'`), so emitting one
      would produce a script that runs and paints nothing, and registering its bytes would
      write an asset file no call references.

      The notes split rather than retire. `fill.picture` / `table.cell.fill.picture` narrow
      to the surfaces whose bytes cannot be carried at all (no embedded part, part missing,
      SVG) and now fire on no corpus fixture; new `fill.picture.geometry` /
      `table.cell.fill.picture.geometry` (approximated/unwritable) cover what the write
      path's fixed `<a:srcRect/><a:stretch><a:fillRect/></a:stretch>` cannot express —
      tiling, source crop, destination inset, `@dpi`, `@rotWithShape="0"` — and are recorded
      only when the source uses one. Both new ids are mapped to `[]` in
      src/script/verify/diff.ts: none of that geometry exists in the IR on either side, and
      mapping them to `fill` would excuse an image fill that failed to come back at all.
    constructs:
      - blip-fill-shape
    evidence:
      kinds:
        - local-source-inspection
        - powerpoint-authored-comparison
        - regression-test
      local_files:
        - src/script/from-read/picture-fill.ts
        - src/script/from-read/shape.ts
        - src/script/from-read/table.ts
        - src/script/from-read/deck.ts
        - src/script/verify/diff.ts
        - test/read/script-ir.test.js
