      count (`slide._slideObjects.length`, passed from the caller) and accepts a
      `shapeIndex` only in `[0, topLevelCount)` — the exact range whose `spid =
      shapeIndex + 2` mirrors the `idx + 2` top-level allocation in
      `collectSlideShapeIds` (group children take ids past that range and are
      addressable by `objectName` only, per the AnimationProps doc "Counts top-level
