  - id: upstream-issue-1183
    source: "gitbrent/PptxGenJS#1183"
    type: issue
    first_seen: 2026-06-07
    last_reviewed: 2026-07-28
    status: non-target
    priority: none
    target_area:
      - chart-ooxml
      - missing-pptx-feature
    applies_to_current_project: no
    non_target_reasons:
      - composition-belongs-downstream
    summary: Asked for a semi-circle chart derived from pie or doughnut charts.
    current_project_notes: |
      Reviewed 2026-07-28 (supersedes the 2026-06-20 note, which claimed the need
      was fully met by existing primitives — it is not; see the no-fill gap below).

      A semicircle is not an OOXML construct. PowerPoint has no half-pie or
      half-doughnut chart type: c:pieChart and c:doughnutChart are the only wedge
      families, and a semicircle is produced by DATA SHAPING — append a padding
      point equal to the sum of the visible values, rotate the resulting gap out of
      view, and hide the padding wedge. That recipe (padding math, rotation, label
      suppression, the caller-facing API shape) is deck-authoring logic, so its home
      is a consumer-side component layer, not this emitter. Compare the parked
      component-registry entry dn-registry-components for the class of work this
      belongs to — cross-referenced for CLASSIFICATION ONLY; that item is on-hold
      and owner-gated, and nothing here proposes reactivating it.

      The composition is NOT fully expressible from today's primitives, and the one
      missing piece is generic:
        - firstSliceAng (types/chart.ts:560, emitted plot-pie.ts:193) — present.
        - holeSize (types/chart.ts:492, emitted plot-pie.ts:195) — present.
        - a genuinely invisible padding wedge — ABSENT. The pie/doughnut c:dPt block
          emits <a:solidFill> unconditionally (plot-pie.ts:86) and
          ChartDataPointStyle.fill is a bare HexColor (types/chart.ts:89), with no
          'none' and no transparency. A downstream component must therefore hardcode
          a background-matched hex, coupling the component to the slide background
          and breaking over an image or gradient fill.

      c:dPt > c:spPr is CT_ShapeProperties, so <a:noFill> is legal there. Per-point
      no-fill (or fill transparency) on pie/doughnut data points is thus a real,
      generic OOXML gap that this library owes any component layer — but it is a
      separate primitive, not the semicircle feature, and is not tracked by this
      entry.
    evidence:
      kinds:
        - local-source-inspection
      local_files:
        - src/gen/chart/plot-pie.ts:86
        - src/gen/chart/plot-pie.ts:193
        - src/gen/chart/plot-pie.ts:195
        - src/types/chart.ts:89
        - src/types/chart.ts:492
        - src/types/chart.ts:560
      schema_fixture: null
      validator_result: null
      powerpoint_result: null
