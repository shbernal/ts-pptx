  - id: dn-animation-objectname-escaping
    source: downstream
    type: downstream-need
    first_seen: 2026-07-27
    last_reviewed: 2026-07-27
    status: implemented
    priority: p2
    target_area:
      - typescript-api
    applies_to_current_project: yes
    non_target_reasons: []
    summary: addAnimation objectName lookup compares a raw caller string against the stored XML-escaped objectName, silently dropping animations targeting a shape whose name contains an XML metacharacter
    current_project_notes: |
      Implemented. `resolveObjectNameToId` (src/gen/slide/shape-ids.ts) now owns the escaping: it
      takes the RAW caller-supplied name, escapes it once (`encodeXmlAttrValue`), and compares that
      against the stored name. Its docblock states the rule and why the stored text is escaped in
      the first place (define-time escaping, so `cNvPrOpen` can emit `<p:cNvPr name>` verbatim).
      `addAnimation` needed no change beyond a docblock note — it already passed the raw name, so
      its warning already quoted the caller's spelling. `addConnector`'s `resolveCxn` stopped
      pre-escaping and now stores the raw name in `_startCxn`/`_endCxn`, so there is exactly one
      place that knows about the escaping.

      Scoping found the same defect in `groupObjects()`, which does not go through that helper and
      was worse: it THREW `cannot group "Q&A" — no top-level object on this slide has that
      objectName` for an object plainly on the slide, and its `findNameInGroups` hint used the same
      key, so a name that WAS already grouped was reported as a typo. Both now compare on the
      escaped key (src/gen/define/group.ts), while every error message stays on the caller's raw
      spelling; the duplicate-name guard stays keyed on the raw name for the same reason.

      The root-cause option — store `objectName` raw and escape at emission in `cNvPrOpen` — was
      considered and not taken. It is the cleaner data model (no field would hold markup) and would
      also de-escape the duplicate-name warning text, but it touches ten `add*Definition` sites plus
      the emitter, exposes byte-level oracles across most regression suites, and buys no
      user-visible behaviour beyond warning strings once the compare-side rule is documented in one
      place. The single-escape design in `cNvPrOpen` is deliberate and documented there; revisit
      only if a second field ever needs the raw name.

      Covered by regression tests over the full attribute-escaper set (`&`, `<`, `>`, `"`, `'`, tab,
      newline): an animation targeting a top-level object and a group child, `groupObjects()`
      grouping such names and telling "already grouped" apart from "no such object", and a connector
      binding both endpoints to metacharacter names (the case that worked before and had to keep
      working after the store-raw switch).
