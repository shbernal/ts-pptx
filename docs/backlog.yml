    summary: Drop the positional `type` argument from addChart(); take only data + opts with `type` required on opts
    current_project_notes: |
      IMPLEMENTED (additive phase, mirroring fork-transparency-width-props). The
      canonical signature is now `addChart(data, { type, ...options })` with `type`
      required on the options object; the single-type overload enforces it via
      `IChartOpts & { type: CHART_NAME }` and the runtime throws when it is missing
      (no more silent typeless chart). The old positional form
      `addChart(type, data, options)` is retained as a `@deprecated` overload that
      logs a one-time `warnOnce` deprecation and normalizes to the same internal path.
      Multi-type (combo) charts are unchanged — `addChart(IChartMulti[], options)` —
      because the combo array already lived in the first positional slot; an
      `isMultiChart` shape guard (element has both `type` and `data`) distinguishes it
      from single-chart `OptsChartData[]`.

      Wiring: dispatch + overloads in src/slide.ts (addChart), facade overloads in
      src/core-interfaces.ts PresSlide, new optional `IChartOpts.type`. Internal
      `addChartDefinition` (src/gen-objects.ts) signature is untouched — for combo
      charts the shared options are still passed in its legacy `data` slot.

      Deferred (not part of this change): dropping the deprecated positional overload
      itself, and migrating the ~140 legacy demo/test call sites off it (they keep
      working under the deprecation). Downstream: downstream should move to the
      `addChart(data, { type })` form before the positional overload is removed.
