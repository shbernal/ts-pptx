    summary: slide-number placeholder hardcoded cNvPr id=25; group children allocate ids past _slideObjects.length so a grouped slide could collide with it
    current_project_notes: |
      Carried forward from GROUPING-PLAN.md §3, which is being removed now that all
      six grouping phases have landed.

      src/gen-xml.ts:1393 emitted the slide-number placeholder with a hardcoded
      `<p:cNvPr id="25" …>`. Object ids are otherwise allocated from
      `_slideObjects.length` upward, and group children allocate ids *past* that
      length (childIdxAlloc, seeded beyond the last top-level id), so a slide with
      groups reaches id 25 sooner than a flat slide with the same object count. A
      sufficiently populated grouped slide could therefore emit id 25 twice — a
      duplicate `<p:cNvPr>` id, which PowerPoint repairs.

      PRE-EXISTING and hard to hit: 24 top-level objects on a single slide already
      sufficed to collide even without groups, so this was not a grouping-introduced
      defect — grouping only lowers the object count needed to reach it. Left out
      of the grouping phases as strictly out of scope.

      IMPLEMENTED (2026-07-17): the placeholder id is now taken from the same
      monotonic counter as every other shape. `childIdxAlloc` (the counter that seeds
      group-child ids past the top-level `idx + 2` range) holds the next unused index
      after the whole object/group walk, so STEP 4 allocates `childIdxAlloc++ + 2` —
      the next free slot — instead of the literal 25. It therefore cannot alias a
      shape or group-child id at any slide population, and the derivation is identical
      for masters/layouts (same `_slideObjects`/`childIdxAlloc`). Two regressions in
      test/regression/object-identity.test.js: a flat 24-object slide (the old id 25
      aliased the object at idx 23) now emits unique ids with the placeholder as the
      highest/next-free id, and a grouped slide proves the id lands past every
      group-child id. No test pinned the literal 25; full suite green (1149
      regression/read/schema tests), typecheck clean.
