  - id: fork-addchart-mutates-caller-labels
    source: fork:src/gen/define/chart.ts
    type: fork-internal-proposal
    first_seen: 2026-07-27
    last_reviewed: 2026-07-28
    status: implemented
    priority: p2
    target_area:
      - chart-ooxml
      - typescript-api
    applies_to_current_project: yes
    non_target_reasons: []
    summary: addChart normalizes a series' `labels` from string[] to string[][] in place, mutating the caller's array
    current_project_notes: |
      `addChart` normalizes each series' `labels` to the nested `string[][]` form the
      multi-level-category serializer wants, and it does so by assigning back onto the
      caller's own object. After `pptx.addChart(data, opts)`, `data[0].labels` is
      `[['A','B','C']]` — one nested array where the caller passed three strings.

      Reproduction is three lines:

        const data = [{ name: 'mix', labels: ['A','B','C'], values: [1,2,3] }]
        pptx.addSlide().addChart(data, { x:1, y:1, w:4, h:3, type: 'doughnut' })
        // data[0].labels is now [['A','B','C']]

      This is a silent action-at-a-distance bug for any caller that reuses its own data
      after charting it — building a legend, a table, or a second chart from the same
      arrays. It surfaced while writing demos/showcases/quarterly-review, where iterating
      `labels` after the chart call to build the mix legend produced one nested array
      instead of three labels, and the failure landed as a `TypeError` deep inside
      `addTextDefinition` ("Cannot create property 'options' on string 'Platform'") with
      nothing in the message pointing at the chart. The deck now keeps a separate plain
      source of truth and derives the chart arrays from it, which works but is a
      workaround for library behavior, not a design.

      The fix is to normalize into a copy rather than in place. `values` should be checked
      at the same time — anything else the chart path writes back onto the caller's series
      objects has the same problem. Public option objects should be treated as read-only
      inputs throughout; that is the general rule this violates, so the audit is worth
      more than the single-line fix.

      IMPLEMENTED (2026-07-28). `addChartDefinition` now builds its own copies:
      `normalizeChartSeries` returns a new series object carrying `_dataIndex` and the
      nested `labels`, and `copyChartOptions` copies the caller's `ChartOpts` (plus the
      nested `plotArea`/`chartArea`/`dataBorder`/`layout`/gridline/`shadow` objects the
      normalizers write into) before any default, clamp or `delete` is applied. The audit
      the note asked for found two more caller-visible writes, both fixed here: the option
      normalization above (defaults written onto the caller's object, invalid keys deleted
      from it — so one options object shared by two charts made the second chart inherit the
      first's normalization), and `slide-builder.ts` stamping `_type` onto the caller's
      options before delegating. `values`/`sizes`/`customLabels`/`pointStyles`/`errorBars`
      needed no copy: everything under `src/gen/chart/` is a pure string builder that only
      reads them.

      One structural trap is worth recording: the combo path plots each subchart from
      `opts._type[i].data` (`gen/chart/chart-xml.ts`), not from the flattened `rel.data`, so
      it only worked because the in-place mutation was visible through both views. The fix
      rebuilds the whole `ChartMulti[]` around the normalized copies so both still reference
      the same series objects; a regression case pins it (without it the second subchart
      emits `<c:idx val="undefined"/>`).

      `_dataIndex` was dropped from the public `OptsChartData` type — it existed only
      because the normalization wrote it onto the caller's object — and remains required on
      the internal `OptsChartDataInternal`. Emitted OOXML is unchanged: every chart part and
      embedded worksheet of the showcase deck is byte-identical across the change. The
      demo's workaround comment in demos/showcases/quarterly-review/data.mjs is removed.
    evidence:
      kinds:
        - local-source-inspection
        - minimal-repro
        - regression-test
      local_files:
        - src/gen/define/chart.ts
        - src/slide-builder.ts
        - src/types/chart.ts
        - test/regression/chart-input-immutability.test.js
        - demos/showcases/quarterly-review/data.mjs
      schema_fixture: null
      validator_result: null
      powerpoint_result: null
      spec_refs: []
    next_action: none
  - id: dn-negative-extent-normalization
    source: downstream
    type: downstream-need
    first_seen: 2026-07-27
    last_reviewed: 2026-07-28
    status: implemented
    priority: p2
    target_area:
      - invalid-ooxml
      - powerpoint-repair
    applies_to_current_project: yes
    non_target_reasons: []
    summary: addShape emits a negative <a:ext cy>/<a:ext cx> when handed a negative h/w, producing a file PowerPoint rejects as corrupt
    current_project_notes: |
      `addShape` passes `w`/`h` straight through to `<a:ext cx=… cy=…>` without
      normalizing the sign. Both attributes are `ST_PositiveCoordinate`, so a
      negative value is schema-invalid: PowerPoint refuses the whole presentation
      with "The file or directory is corrupted and unreadable" (0x80070570) and
      names no shape, part, or slide. LibreOffice renders the same file happily,
      so the defect is invisible to any consumer whose render step is LibreOffice
      and only appears once the deck reaches PowerPoint.

      This is easy to hit whenever a line is drawn from computed endpoints, since
      the natural expression of "draw from A to B" is a signed delta:

        // a leader/connector line that happens to run upward
        slide.addShape('line', { x: x0, y: y0, w: x1 - x0, h: y1 - y0 })
        // y1 < y0  ->  <a:ext cx="128016" cy="-2644902"/>  ->  file rejected

      The correct encoding is the normalized bounding box plus a flip, which
      `connector()` already derives for its own endpoints
      (`src/gen/define/connector.ts`, `flipH: x2 < x1` / `flipV: y2 < y1`). The
      generic shape path has no equivalent, so every caller has to remember to
      write `Math.min`/`Math.abs` plus `flipH`/`flipV` by hand, and forgetting it
      fails far from the call site with an error that points nowhere.

      Suggested fix: normalize in the shape path the way `connector()` already
      does — move the offset to `min(a, b)`, take `abs()` for the extent, and set
      `flipH`/`flipV` accordingly. Failing that, throw on a negative `w`/`h` at
      the API boundary so the error names the offending shape instead of
      surfacing as a corrupt file. Silently writing an out-of-range extent is the
      worst of the three outcomes.

      RESOLVED (2026-07-28) by normalizing, not throwing. The normalization is a
      single helper, `normalizeAxisExtent` in `src/gen/slide/object.ts`, applied
      per axis in the shared `renderSlideObjectXml` prologue — *after* every
      `Coord` form ('50%', '-2in', a plain number) has resolved to EMU, so a
      negative percent or unit string normalizes alongside a negative number, and
      *before* the per-kind `render*Object` branch, so shapes, text boxes, images,
      media, charts, tables, OLE, and zoom all get the same treatment rather than
      only `addShape`. A derived flip XOR-composes onto the author's own
      `flipH`/`flipV`, so `{ w: -2, flipH: true }` is mirrored twice, i.e. not at
      all. `addConnector` is unaffected: it already normalizes at define time, so
      the helper is a no-op on its box and passes its flips through.

      Group auto-bounds (`resolveObjBounds`) normalize each child the same way
      before taking the bounding box; otherwise a child with a negative extent
      reports a `maxX` left of the group's `minX` and collapses the group frame.

      No warning is emitted. A signed delta is a legitimate way to express "draw
      from A to B", and the normalized box + flip is the exact encoding PowerPoint
      itself writes for that geometry — so this is a well-defined interpretation
      rather than the silent coercion the API-evolution policy warns about.
    evidence:
      kinds:
        - local-source-inspection
        - ooxml-reference
        - minimal-repro
        - extracted-xml
        - regression-test
        - schema-fixture
        - validator-result
        - powerpoint-result
      local_files:
        - src/gen/slide/object.ts
        - src/gen/define/shape.ts
        - src/gen/define/connector.ts
        - test/regression/negative-extent-normalization.test.js
        - test/schema-cases.js
      schema_fixture: test/schema-cases.js (negative-extent-normalization)
      validator_result: pass
      powerpoint_result: >-
        opens clean — a deck built from negative w/h on a shape, a text box, and a group child
        opened in desktop PowerPoint over COM (scripts/powerpoint-com-smoke.mjs --file) with no
        repair prompt, replacing the 0x80070570 rejection this entry recorded
      spec_refs:
        - ECMA-376 Part 1, DrawingML CT_PositiveSize2D (a:ext @cx/@cy are ST_PositiveCoordinate)
    next_action: none
