  - id: upstream-issue-1223
    source: "gitbrent/PptxGenJS#1223"
    type: issue
    first_seen: 2026-06-07
    last_reviewed: 2026-07-28
    status: non-target
    priority: none
    target_area:
      - chart-ooxml
      - missing-pptx-feature
    applies_to_current_project: no
    non_target_reasons:
      - insufficient-evidence
    summary: Asked for stacked and unstacked bars together in a chart.
    current_project_notes: |
      Reviewed 2026-07-28 (supersedes the 2026-06-07 note, which assumed the chart
      structure was unproven — it is now built and validated locally).

      NOT a missing feature: the library already emits it. The combo path merges
      per-subchart options (chart-xml.ts:380) and c:grouping is written per chart
      group (plot-cat-axis.ts:62), so two bar subcharts with different barGrouping
      produce two <c:barChart> groups on one axis pair:

        addChart([
          { type: ChartType.bar, data: stacked,   options: { barGrouping: 'stacked' } },
          { type: ChartType.bar, data: clustered, options: { barGrouping: 'clustered' } },
        ], { x: 1, y: 1, w: 8, h: 4 })

      Verified 2026-07-28 by a built fixture: zero OpenXmlValidator errors, correct
      per-group c:grouping and c:overlap (100 vs 0), a single shared axId pair, and
      c:idx/c:order unique across groups (0/0, 1/1, 2/2) — the cross-group series
      collision that would corrupt the legend does not occur. The secondary-axis
      variant (secondaryValAxis/secondaryCatAxis on one group) also validates clean.

      WHAT REMAINS UNVERIFIED is rendering, not emission: two bar groups sharing one
      category axis each cluster across the same category slots, so PowerPoint may
      draw them overlapped rather than side by side. Nobody has opened one
      (powerpoint_result: null), so whether the output looks like the request wants
      is unknown — that unknown, not the structure, is what keeps this dismissed
      under insufficient-evidence. Side-by-side layout, if PowerPoint does overlap
      them, is again a data-shaping recipe (spacer series plus per-group
      barGapWidthPct/barOverlapPct) and would belong downstream — compare
      upstream-issue-1183.

      ADJACENT DEFECT FOUND while probing this, tracked separately as
      dn-combo-subchart-option-validation: ChartMulti[].options bypassed
      normalizeChartOptions entirely, so per-subchart barOverlapPct / barGapWidthPct /
      barGrouping were emitted raw. That was a repair-class hole reachable ONLY through
      the combo API this entry describes; fixed 2026-07-28, and a side effect of the
      fix is that the stacked group here now emits gapWidth 50 rather than 150.
    evidence:
      kinds:
        - local-source-inspection
        - generated-pptx
        - schema-fixture
        - validator-result
      local_files:
        - src/gen/chart/chart-xml.ts:380
        - src/gen/chart/plot-cat-axis.ts:62
        - src/gen/chart/plot-cat-axis.ts:319
        - test/schema-cases.js
