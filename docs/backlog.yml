    summary: Group already-authored named slide objects into editable PowerPoint groups without recreating their descriptors
    current_project_notes: |
      A consumer that composes a slide from reusable renderers already has fully
      authored text, shape, image, connector, and nested-group objects with stable
      object names. It needs to turn selected existing objects into an editable
      PowerPoint group after composition, while preserving their relationships,
      ids, geometry, and relative z-order. The current `addGroup()` API only accepts
      fresh child descriptors, so using it would require every renderer to expose
      and replay its internal descriptors instead of grouping the objects it emitted.

      Proposed public API: `slide.groupObjects(objectNames, options?)`, operating on
      already-authored top-level objects. It should move the named objects into one
      `<p:grpSp>`, preserve their order within the group, define the wrapper's z-order
      deterministically (for example at the highest selected object's former slot),
      auto-compute bounds when no explicit frame is supplied, reject or clearly warn
      for unsupported object kinds, and report missing or duplicate names. Existing
      group objects should be accepted so consumers can build nested logical groups.

      IMPLEMENTED (2026-07-17, GROUPING-PLAN.md Phase 5): `slide.groupObjects(objectNames,
      options?)` lifts the named top-level objects into one `<p:grpSp>` in place, sharing
      the group render-object builder (`makeGroupObject`) with `addGroup()` so both name
      and frame a group identically — including deferring the all-or-nothing auto-bounds to
      `gen-xml` (passing `x/y/w/h` through unset is what makes the frame the children's
      bounding box, so neither entry point does bounds math). Two z-order rules keep the
      lift visually a no-op: children are ordered by their existing slide z-order (not the
      naming order, which would restack the slide), and the wrapper takes the topmost
      member's former slot. Departing from the proposal's "reject or clearly warn": every
      failure THROWS (missing name, name already inside another group, ambiguous duplicate
      name, ungroupable kind, empty/duplicate input) — per AGENTS.md's footgun rule, since
      each alternative silently leaves the intended object loose on the slide. Resolution
      runs fully before any move, so a bad name leaves the slide untouched. Accepted kinds:
      text/shape, image, connector, and group (for nesting); charts, media, tables, and
      placeholders throw. Verified in desktop PowerPoint (opens without repair, unique ids
      across the nested tree, a connector bound to a lifted member still resolves).
    evidence:
      kinds:
        - local-source-inspection
        - regression-test
      local_files:
        - src/slide.ts
        - src/gen-objects.ts
        - test/regression/group-shapes.test.js
