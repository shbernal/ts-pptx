    summary: "Read model cannot see a table cell's picture fill: TableCell.resolvedFill decodes only solid fills, so a blipFill cell reads as unfilled."
    current_project_notes: >
      Opened when the WRITE side landed cell picture fill (2026-07-27), which turned a
      pre-existing read blindness into an asymmetry: this package can now emit an
      `a:blipFill` inside `a:tcPr`, read the same deck back, and report nothing there.

      `TableCell.resolvedFill` (src/read/api/table.ts) runs `resolveSolidFillColor` over
      the cell's `a:tcPr` and then falls back to the table style graph. Both paths only
      understand `a:solidFill`, so a picture-filled cell returns `null` — indistinguishable
      from a cell with no fill at all. Any consumer diffing or replicating a deck therefore
      drops the fill silently rather than reporting it as unsupported. `Table.resolvedStyle`
      and `TableCell.borders` are unaffected.

      Deferred rather than built with the write side, deliberately: the write gap is what
      the original request touched, the read model has its own prioritization workflow
      (`scripts/read-blindness-census.mjs`), and a picture accessor should be designed
      against the shape/background picture-fill accessors as a set rather than bolted onto
      the table in isolation. Shape image fills have the same blindness, so this is a slice
      of a broader read-side picture-fill story, not a table-only defect.

      The fixture gate is already satisfied: test/read/fixtures/table-cell-image-fill.pptx
      is PowerPoint-authored and carries stretched, tiled, bordered and merged picture-fill
      cells, so a read accessor can be written against genuine Office XML immediately.
