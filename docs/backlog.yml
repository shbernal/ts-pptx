      Two behaviors the tests had to be written around, both pinned rather than
      changed, and both worth knowing before touching these files:
        - `cleanOpts` runs once for the text object and again per run, and
          `addText(string, opts)` hands the SAME options object to both, so the
          shorthand normalizes twice where the array form normalizes once. Decisive
          for line defaults (`shape: 'line'` alone emits a full 1pt solid line
          through the shorthand and an empty `<a:ln>` through the array form) and it
          doubles every warning the definer emits.
        - the bar `dataLabelPosition` rules run in sequence rather than as a switch,
          so the outcome inverts the obvious reading: `outEnd` is dropped on
          CLUSTERED bars by the first rule and kept on STACKED ones by the second.

