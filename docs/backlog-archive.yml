# Upstream issue/PR tracking against gitbrent/PptxGenJS was retired; these entries are the
# reviewed remnant of it, moved out of `backlog.yml` so that file holds only work this project
# intends to do. Every entry here was already dispositioned (mostly `non-target`) and none has a
# `next_action` beyond `none`.
#
# They are kept rather than deleted because each records a *reviewed judgement* — why a reported
# behaviour is or is not a defect in this library — which is worth having if the same report
# arrives again. Their `evidence.local_files` point at the pre-split `src/*.ts` layout
# (`gen-xml.ts`, `gen-objects.ts`, `gen-charts.ts`, `core-interfaces.ts`, `pptxgen.ts`) and are
# NOT maintained; treat them as provenance for the review, not as navigable references. This is
# also why `backlog:validate` skips this file.
#
# Do not add entries here. New work goes in `backlog.yml`.
