  - id: upstream-issue-585
    source: "gitbrent/PptxGenJS#585"
    type: issue
    first_seen: 2026-06-07
    last_reviewed: 2026-08-06
    status: implemented
    priority: p3
    target_area:
      - missing-pptx-feature
    applies_to_current_project: partial
    non_target_reasons: []
    summary: Requested embedding PowerPoint 3D model assets.
    constructs:
      - model3d-object
    current_project_notes: |
      Implemented 2026-08-06 as `slide.addModel3d({ path | data, preview, camera,
      meterPerModelUnit, ... })`. As predicted when this was deferred, a 3D model is not a
      `p:pic` variant and did not extend the media path: it is an `<mc:AlternateContent>`
      whose `mc:Choice` holds a `<p:graphicFrame>` in the 2017 `am3d` namespace and whose
      `mc:Fallback` holds a preview picture. It was built on the zoom lane's structure, not
      the media lane's — `MediaType` is untouched.

      Gated on a COM-authored fixture first (`test/read/fixtures/model3d.pptx`, from
      `Shapes.Add3DModel`), which corrected two guesses that would have shipped broken:
      the content type is `model/gltf.binary` (a dot, not the IANA-style
      `model/gltf-binary`), and the rel type sits under `.../office/2017/06/...`, not the
      `2017` of the namespace. The `am3d` body ts-pptx emits is byte-identical to
      PowerPoint's own, modulo rIds and the frame extent.

      Two deliberate limits, both documented in `docs/3d-models.md`:
      - No glTF parsing. PowerPoint derives `meterPerModelUnit` and the camera from the
        model's bounding box (it normalizes the largest extent to 1 metre, then places the
        camera at `|halfExtents / maxExtent| / sin(fov/2)` — measured across three probe
        models). ts-pptx emits the cube fixture's values and exposes `meterPerModelUnit`
        and `camera` as overrides; the scale is the one most models must set.
      - No typed read accessor. A model reads back as an inert `graphicFrame`, preserved
        byte-intact through load/save and `importSlide`.

      Verification note worth keeping: the Open XML SDK validator does NOT descend into an
      `mc:Choice`, only into `mc:Fallback`. Measured at Microsoft365 — a bogus attribute, an
      unknown child, wrong document order, a non-numeric `fov`, and even a deleted required
      `r:embed` inside `am3d:model3d` all report zero errors. That is a property of
      `mc:AlternateContent`, so the zoom and OLE emitters share the blind spot. Coverage
      here therefore rests on the byte-comparison against the fixture plus `test:com`, which
      exports the slide to PNG — necessary because with a corrupted `.glb` PowerPoint still
      reports `msoShape3DModel` with the right camera and renders nothing.
    evidence:
      kinds:
        - local-source-inspection
        - powerpoint-authored-comparison
        - schema-fixture
        - regression-test
        - render-check
      local_files:
        - src/types/model3d.ts
        - src/gen/define/model3d.ts
        - src/gen/slide/objects/model3d.ts
        - src/gen/slide/object.ts
        - test/read/model3d-roundtrip.test.js
        - test/read/fixtures/model3d.pptx
        - test/read/fixtures/authoring/author-model3d.ps1
        - scripts/powerpoint-com-smoke.mjs
        - docs/3d-models.md
      schema_fixture: test/schema-cases.js "model3d embedded 3D models (am3d graphicFrame + preview fallback)"
      validator_result: 0 errors at Microsoft365 — but see the blind-spot note above; this covers the mc:Fallback branch and the package graph, not the am3d body
      powerpoint_result: opens clean; Shape.Type 30 (msoShape3DModel), CameraPositionZ reads back 2.263033, and the exported slide PNG shows the rasterized model with zero fallback pixels
      spec_refs: []
