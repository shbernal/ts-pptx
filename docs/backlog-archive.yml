    summary: Wanted autoPage to keep an overflowing HTML table row together on the next slide.
    current_project_notes: |
      Deferred (in scope, reduce scope before building). A keep-row-together option
      complicates the line-splitting pagination for an edge case, and a row taller
      than a full page is still unsolvable. Wait for a concrete report before adding
      the option.

      Re-reviewed 2026-07-27, still unimplemented and still correctly framed; only
      the file references were stale. `src/gen-tables.ts` no longer exists — the
      pagination engine now lives in `src/gen/table/autopage.ts`
      (`getSlidesForTableRows`, line 218), with `parseTextToLines` (line 40) doing
      the wrap measurement and the overflow decision at line 552.

      One neighbouring mechanism HAS landed since this was filed and narrows what is
      left: `colSpanDepths` / `hasActiveRowSpan` (autopage.ts:367, 422, 552, 642)
      already suppresses a page break that would split a *rowspan group* across
      slides. So the "do not break here" plumbing exists at exactly the overflow
      site this option would hook — the remaining work is the opt-in flag plus a
      policy for the unsolvable case (a single row taller than one page), not new
      machinery. Reuse `hasActiveRowSpan`'s suppression point rather than adding a
      second one.

      Re-reviewed 2026-07-31 during a table write/read gap-closing pass (border dash
      styles, perimeter borders, diagonals, anchorCtr, cell3D, table background,
      read-path cell and structural editors). Deliberately untouched and still
      correctly framed: every one of those is a per-cell or per-table *property*,
      while this is a pagination *policy*, so none of them moved the decision either
      way. The two open questions remain what they were — the opt-in flag's name and
      the behaviour for a row taller than one page — and both still want a concrete
      report rather than a guess. Line references above re-checked and still accurate.
    evidence:
      kinds:
        - local-source-inspection
      local_files:
        - src/gen/table/autopage.ts:218
        - src/gen/table/autopage.ts:40
        - src/gen/table/autopage.ts:552
        - src/gen/table/autopage.ts:642
